      operationId: getStockCandles
      tags: [widgets]
      summary: Get recent daily closing prices (for inline sparklines) for symbols
      security:
        - bearerAuth: []
      parameters:
        - name: symbols
          in: query
          required: false
          description: >-
            Comma-separated ticker symbols to fetch recent daily closes for
            (e.g. "AAPL,MSFT,VOO"). When omitted or empty, representative demo
            series are returned so an unconfigured tile still renders.
          schema:
            type: string
      responses:
        "200":
          description: Recent closing-price series, one per resolved symbol
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockCandlesData"
        "502":
          description: The configured stock-quote provider could not be reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /widgets/stocks/search:
    get:
      operationId: searchStocks
      tags: [widgets]
      summary: Search for stock symbols by ticker or company name (for the tile editor)
      security:
        - bearerAuth: []
      parameters:
        - name: q
          in: query
          required: true
          description: Search text (ticker fragment or company name).
          schema:
            type: string
      responses:
        "200":
          description: Matching symbols
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StockSearchData"
        "502":
          description: The configured stock-quote provider could not be reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /widgets/weather:
    get:
      operationId: getWeatherWidget
      tags: [widgets]
      summary: >-
        Get current conditions and a multi-day forecast for either browser
        coordinates or a typed city name. Geocoding, reverse geocoding, and the
        Open-Meteo forecast call all happen server-side so the browser never
        talks to third-party APIs directly.
      security:
        - bearerAuth: []
      parameters:
        - name: lat
          in: query
          required: false
          description: >-
            Latitude from browser geolocation. Must be paired with lon; takes
            precedence over city when both are provided.
          schema:
            type: number
        - name: lon
          in: query
          required: false
          description: Longitude from browser geolocation. Must be paired with lat.
          schema:
            type: number
        - name: city
          in: query
          required: false
          description: >-
            City/place name to geocode when coordinates are not provided.
          schema:
            type: string
        - name: units
          in: query
          required: false
          description: 'Temperature units: "c" for Celsius (default), "f" for Fahrenheit.'
          schema:
            type: string
            enum: [c, f]
      responses:
        "200":
          description: Current conditions plus a multi-day forecast
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeatherWidgetData"
        "400":
          description: Neither coordinates nor a city name were provided
          content:
            application/json:
              schema:
