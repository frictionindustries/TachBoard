              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    VersionInfo:
      type: object
      required: [currentVersion, latestVersion, releaseUrl, updateAvailable, checkEnabled]
      properties:
        currentVersion:
          type: string
        latestVersion:
          type: ["string", "null"]
        releaseUrl:
          type: ["string", "null"]
        updateAvailable:
          type: boolean
        checkEnabled:
          type: boolean

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    AuthCredentials:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          minLength: 3
        password:
          type: string
          minLength: 6

    AuthResponse:
      type: object
      required: [token, user]
      properties:
        token:
          type: string
        user:
          $ref: "#/components/schemas/UserProfile"

    UserProfile:
      type: object
      required: [id, username]
      properties:
        id:
          type: integer
        username:
          type: string

    Tile:
      type: object
      required: [id, userId, type, gridX, gridY, gridW, gridH]
      properties:
        id:
          type: integer
        userId:
          type: integer
        pageId:
          description: >-
            The page this tile belongs to. Null only for tiles that predate the
            multi-page migration and could not be assigned a page.
          type: ["integer", "null"]
        deviceModeId:
          description: >-
            The device mode (layout profile) this tile belongs to. Null only
            for rows that predate device modes and could not be assigned one.
          type: ["integer", "null"]
        variant:
          description: >-
            Adaptive layout variant key this tile belongs to (e.g.
            "fhd-landscape"). Null means the base layout used by auto/fixed
            pages.
          type: ["string", "null"]
        type:
          type: string
          enum: [app, truenas, media, sonarr, radarr, lidarr, qbittorrent]
        integration:
          type: ["string", "null"]
          enum: [truenas, media, jellyfin, sonarr, radarr, lidarr, qbittorrent, pihole, nginx-proxy-manager, prowlarr, pterodactyl, tailscale, ersatztv, audioplayer, clock, timer, weather, sports, news, stocks, sleeper, email, calendar, note, spacer, divider, eightball, dice, coinflip, fortune, tamagotchi, bonsai, aquarium, visualizer, pictureframe, videoplayer, aichat, null]
        gridX:
          type: integer
        gridY:
          type: integer
        gridW:
          type: integer
        gridH:
          type: integer
        name:
          type: ["string", "null"]
        url:
          type: ["string", "null"]
        bgColor:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        imageFit:
          type: ["string", "null"]
          enum: ["cover", "contain", "none", "center", "top-left", null]
        imagePosition:
          description: >-
            How the image is positioned within the tile. Newer tiles store a free
            drag-set pan as "pan(<x>,<y>)" — a CSS translate in percent of the
            tile box (e.g. "pan(-12.5,30)"), which works on both axes at any zoom.
            Legacy values are also honored: a named anchor key (e.g. "center",
            "top-left") or a focal point as a CSS object-position "<x>% <y>%".
            Null falls back to the legacy imageFit behavior.
          type: ["string", "null"]
        imageScale:
          description: >-
            Zoom percentage applied to the image (100 = native). Null means no
            scaling.
          type: ["integer", "null"]
        titleSize:
          description: >-
            Size key for the tile title on plain app/link tiles (e.g. "sm",
            "md", "lg", "xl"). Null means the default. Ignored by integration
            (widget) tiles.
          type: ["string", "null"]
        titlePosition:
          description: >-
            Anchor key for where the tile title sits on plain app/link tiles
            (e.g. "center", "top-left"). Null means the default. Ignored by
            integration (widget) tiles.
          type: ["string", "null"]
        titleColor:
          description: >-
            CSS color for the tile title text on plain app/link tiles. Null
            means the default (white over an image, theme color otherwise).
            Ignored by integration (widget) tiles.
          type: ["string", "null"]
        hideTitle:
          description: >-
            When true, the tile renders without its title text (image/widget
            content only). Defaults to false (title shown). Applies to both
            plain app/link tiles and integration (widget) tiles.
          type: boolean
        metrics:
          description: >-
            Enabled metric keys for this tile's integration. Null means "show
            all" (the default for tiles created before metric selection existed).
          type: ["array", "null"]
          items:
            type: string
        tileSettings:
          $ref: "#/components/schemas/TileSettings"
        createdAt:
          type: string

    TileInput:
      type: object
      required: [type, gridX, gridY, gridW, gridH]
      properties:
        pageId:
          description: >-
            The page to create this tile on. Omit to fall back to the user's
            first page.
          type: ["integer", "null"]
        deviceModeId:
          description: >-
            The device mode (layout profile) to create this tile in. Omit to
            fall back to the user's default (first) mode.
          type: ["integer", "null"]
        variant:
          description: >-
            Adaptive layout variant key to create this tile in (e.g.
            "fhd-landscape"). Omit or null for the base layout.
          type: ["string", "null"]
        type:
          type: string
          enum: [app, truenas, media, sonarr, radarr, lidarr, qbittorrent]
        integration:
          type: ["string", "null"]
          enum: [truenas, media, jellyfin, sonarr, radarr, lidarr, qbittorrent, pihole, nginx-proxy-manager, prowlarr, pterodactyl, tailscale, ersatztv, audioplayer, clock, timer, weather, sports, news, stocks, sleeper, email, calendar, note, spacer, divider, eightball, dice, coinflip, fortune, tamagotchi, bonsai, aquarium, visualizer, pictureframe, videoplayer, aichat, null]
        gridX:
          type: integer
        gridY:
          type: integer
        gridW:
          type: integer
        gridH:
          type: integer
        name:
          type: string
        url:
          type: string
        bgColor:
          type: ["string", "null"]
        imageUrl:
          type: string
        imageFit:
          type: string
        imagePosition:
          type: string
        imageScale:
          type: integer
        titleSize:
          type: ["string", "null"]
        titlePosition:
          type: ["string", "null"]
        titleColor:
          type: ["string", "null"]
        hideTitle:
          type: boolean
        metrics:
          type: ["array", "null"]
          items:
            type: string
        tileSettings:
          $ref: "#/components/schemas/TileSettings"

    TileUpdate:
      type: object
      properties:
        integration:
          type: ["string", "null"]
          enum: [truenas, media, jellyfin, sonarr, radarr, lidarr, qbittorrent, pihole, nginx-proxy-manager, prowlarr, pterodactyl, tailscale, ersatztv, audioplayer, clock, timer, weather, sports, news, stocks, sleeper, email, calendar, note, spacer, divider, eightball, dice, coinflip, fortune, tamagotchi, bonsai, aquarium, visualizer, pictureframe, videoplayer, aichat, null]
        gridX:
          type: integer
        gridY:
          type: integer
        gridW:
          type: integer
        gridH:
          type: integer
        name:
          type: string
        url:
          type: string
        bgColor:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        imageFit:
          type: string
        imagePosition:
          type: ["string", "null"]
        imageScale:
          type: ["integer", "null"]
        titleSize:
          type: ["string", "null"]
        titlePosition:
          type: ["string", "null"]
        titleColor:
          type: ["string", "null"]
        hideTitle:
          type: boolean
        metrics:
          type: ["array", "null"]
          items:
            type: string
        tileSettings:
          $ref: "#/components/schemas/TileSettings"

    TileSettings:
      description: >-
        Per-tile extra configuration for integration widgets. Null means no
        extra settings (the default). Carries the qBittorrent category filter,
        the Local Time clock options, the Weather tile options, and the Sports
        tile options.
      type: ["object", "null"]
      properties:
        categoryFilter:
          description: >-
            Allow-list of qBittorrent categories to show on the tile. Null (or
            absent) means show all categories.
          type: ["array", "null"]
          items:
            type: string
        groupByCategory:
          description: >-
            When true, the qBittorrent tile groups its torrents under category
            headers instead of showing a flat list. Absent or false means a
            flat list (the default).
          type: ["boolean", "null"]
        clockFormat:
          description: >-
            Time format for the Local Time tile: "12" for 12-hour with AM/PM,
            "24" for 24-hour. Absent or null defaults to "24".
          type: ["string", "null"]
          enum: ["12", "24", null]
        clockShowSeconds:
          description: >-
            When true, the Local Time tile shows seconds. Absent or false hides
            them (the default).
          type: ["boolean", "null"]
        clockShowDate:
          description: >-
            When true, the Local Time tile shows the current date. Absent or
            false hides it (the default).
          type: ["boolean", "null"]
        weatherAutoLocate:
          description: >-
            When true, the Weather tile auto-detects the user's location via the
            browser. Absent or true defaults to auto-detect; false uses the
            typed weatherLocation instead.
          type: ["boolean", "null"]
        weatherLocation:
          description: >-
            City/place name to geocode for the Weather tile when auto-detect is
            off (or as a fallback). Null or absent means none set.
          type: ["string", "null"]
        weatherUnits:
          description: >-
            Temperature units for the Weather tile: "c" for Celsius, "f" for
            Fahrenheit. Absent or null defaults to "c".
          type: ["string", "null"]
          enum: ["c", "f", null]
        sportsLeagues:
          description: >-
            League keys the Sports tile follows (e.g. "nfl", "nba", "eng.1").
            Null or absent means none selected yet (the tile shows an empty
            state until at least one league is chosen).
          type: ["array", "null"]
          items:
            type: string
        sportsTeams:
          description: >-
            Optional team allow-list for the Sports tile, scoped per league as
            "<leagueKey>:<teamId>" (e.g. "nfl:12"). When a league has no entries
            here, all of its teams are shown. Null or absent means no team
            filtering (all teams in every selected league).
          type: ["array", "null"]
          items:
            type: string
        sportsShowScores:
          description: >-
            When true, the Sports tile shows live/recent scores. Absent or null
            defaults to true. At least one of sportsShowScores / sportsShowNews
            must be on.
          type: ["boolean", "null"]
        sportsShowNews:
          description: >-
            When true, the Sports tile shows the latest headlines. Absent or
            null defaults to false. At least one of sportsShowScores /
            sportsShowNews must be on.
          type: ["boolean", "null"]
        newsFeedUrl:
          description: >-
            RSS or Atom feed URL the News tile pulls headlines from. Null or
            absent means none set, in which case the tile shows demo headlines.
          type: ["string", "null"]
        newsMaxItems:
          description: >-
            Maximum number of headlines the News tile requests/shows. Null or
            absent defaults to a sensible value (clamped server-side).
          type: ["integer", "null"]
        newsShowTimestamp:
          description: >-
            When true, the News tile shows each headline's published time (as
            room allows). Absent or false hides it (the default).
          type: ["boolean", "null"]
        stockWatchlist:
          description: >-
            Per-tile watchlist of stock symbols for the Stocks tile. Each entry
            carries an uppercased ticker symbol and optional share quantity and
            average cost basis per share, which turn the watchlist into a
            lightweight portfolio. Null or absent means none set (the tile shows
            demo/sample quotes).
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/StockWatchEntry"
        sleeperUsername:
          description: >-
            Sleeper account username the Fantasy tile follows. Used to resolve
            the user's id and locate their roster in the league. Null or absent
            means none set (the tile shows an empty state until configured).
          type: ["string", "null"]
        sleeperLeagueId:
          description: >-
            Sleeper league id the Fantasy tile shows. Sleeper's read endpoints
            are public for any league id. Null or absent means none chosen yet.
          type: ["string", "null"]
        sleeperSport:
          description: >-
            Sport the Fantasy tile's league belongs to (e.g. "nfl", "nba").
            Absent or null defaults to "nfl".
          type: ["string", "null"]
        sleeperSeason:
          description: >-
            Season year the Fantasy tile's league belongs to (e.g. "2025").
            Absent or null defaults to the current NFL season.
          type: ["string", "null"]
        sleeperShowMatchup:
          description: >-
            When true, the Fantasy tile shows the user's current-week matchup.
            Absent or null defaults to true.
          type: ["boolean", "null"]
        sleeperShowStandings:
          description: >-
            When true, the Fantasy tile shows the league standings. Absent or
            null defaults to true.
          type: ["boolean", "null"]
        sleeperShowTransactions:
          description: >-
            When true, the Fantasy tile shows recent waiver/trade transactions.
            Absent or null defaults to true.
          type: ["boolean", "null"]
        audioSource:
          description: >-
            Which music source backs an Audio Player tile (e.g. "plex"). Absent
            or null defaults to "plex". This is the seam additional sources
            (Spotify, Jellyfin, Navidrome) plug into later.
          type: ["string", "null"]
        audioFindMusic:
          description: >-
            When true, the Audio Player tile shows the "Find music" button that
            opens the music browser (Plex / Subsonic only). Absent or null
            defaults to true.
          type: ["boolean", "null"]
        audioSearch:
          description: >-
            When true, the Audio Player tile's music browser offers the Search
            tab (Plex / Subsonic only). Absent or null defaults to true.
          type: ["boolean", "null"]
        audioBrowse:
          description: >-
            When true, the Audio Player tile's music browser offers the Browse
            tab (recently added / albums / artists, Plex / Subsonic only).
            Absent or null defaults to true.
          type: ["boolean", "null"]
        audioPlaylists:
          description: >-
            When true, the Audio Player tile's music browser offers the
            Playlists tab (Plex / Subsonic only). Absent or null defaults to
            true.
          type: ["boolean", "null"]
        emailAccounts:
          description: >-
            Allow-list of mail account keys the Email tile aggregates: "gmail"
            for the linked Google account, or the id of a saved IMAP account.
            Null or absent means all configured accounts.
          type: ["array", "null"]
          items:
            type: string
        emailMaxMessages:
          description: >-
            Maximum number of messages the Email tile requests/shows. Null or
            absent defaults to a sensible value (clamped server-side).
          type: ["integer", "null"]
        emailUnreadOnly:
          description: >-
            When true, the Email tile shows only unread messages. Absent or
            false shows the most recent messages regardless of read state.
          type: ["boolean", "null"]
        calendarAccounts:
          description: >-
            Allow-list of calendar account keys the Calendar tile aggregates:
            "google" for the linked Google account, or the id of a saved CalDAV
            account. Null or absent means all configured accounts.
          type: ["array", "null"]
          items:
            type: string
        calendarDaysAhead:
          description: >-
            How many days ahead the Calendar tile looks for upcoming events.
            Null or absent defaults to a sensible value (clamped server-side).
          type: ["integer", "null"]
        calendarMaxEvents:
          description: >-
            Maximum number of events the Calendar tile requests/shows. Null or
            absent defaults to a sensible value (clamped server-side).
          type: ["integer", "null"]
        aiAccountId:
          description: >-
            The saved AI account (from Settings) that backs an AI Chat tile.
            Null or absent means none chosen yet (the tile shows a demo
            conversation until one is selected).
          type: ["string", "null"]
        aiModel:
          description: >-
            Optional per-tile model override for the AI Chat tile. Null or
            absent uses the account's default model.
          type: ["string", "null"]
        scrollable:
          description: >-
            When true, the tile body shows a scrollbar when its content
            overflows instead of clipping it at the tile edge. Absent or false
            clips overflowing content (the default).
          type: ["boolean", "null"]
        hideStatusDot:
          description: >-
            When true, the tile header hides the service-reachability status
            dot even when the backing connection is configured. Absent or
            false shows the dot (the default).
          type: ["boolean", "null"]
        truenasMetric:
          description: >-
            Which single TrueNAS metric a dedicated TrueNAS tile renders with
            its bespoke visual: "cpuram", "network", "arc", "pools", "disks", or
            "cputemp". Null or absent means the tile shows the combined
            multi-section view (the default, backward-compatible behavior).
          type: ["string", "null"]
          enum: ["cpuram", "network", "arc", "pools", "disks", "cputemp", null]
        truenasShowCpuCores:
          description: >-
            When true (or absent, the default), the dedicated CPU-temperature
            TrueNAS tile shows the per-core temperature readout beneath the
            gauge. Set false for a simpler tile with just the headline gauge.
          type: ["boolean", "null"]
        truenasPools:
          description: >-
            Allow-list of TrueNAS ZFS pool (volume) names to show on the tile.
            Applies to both the dedicated ZFS Pools view and the pools section
            of the combined view. Null, absent, or empty means show all pools
            (the default, backward-compatible behavior).
          type: ["array", "null"]
          items:
            type: string
        truenasPoolOrder:
          description: >-
            Explicit display order of TrueNAS ZFS pool (volume) names. Pools
            whose name appears here are shown first, in this order; any remaining
            pools follow in their server-reported order. Applies to both the
            dedicated ZFS Pools view and the pools section of the combined view.
            Null, absent, or empty keeps the server-reported order (the default,
            backward-compatible behavior).
          type: ["array", "null"]
          items:
            type: string
        pterodactylServers:
          description: >-
            Allow-list of Pterodactyl server identifiers to show on the tile.
            Null, absent, or empty means show all servers (the default,
            backward-compatible behavior).
          type: ["array", "null"]
          items:
            type: string
        noteBody:
          description: >-
            Free-form note text for a Note (post-it) tile. Null or absent means
            an empty note.
          type: ["string", "null"]
        noteItems:
          description: >-
            Checklist / to-do items for a Note tile. Each item has text and a
            done flag (rendered with a strike-through when done). Null or absent
            means no checklist.
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/NoteChecklistItem"
        noteColor:
          description: >-
            Background color of a Note (post-it) tile as a CSS color string
            (e.g. a preset note color or a custom hex). Null or absent uses the
            default post-it yellow.
          type: ["string", "null"]
        noteFontSize:
          description: >-
            Font size for a Note tile's text: "sm", "md", or "lg". Absent or
            null defaults to "md".
          type: ["string", "null"]
          enum: ["sm", "md", "lg", null]
        noteTextColor:
          description: >-
            CSS color for a Note tile's text (note body and checklist). Null or
            absent uses a sensible dark default that reads on light post-it
            colors.
          type: ["string", "null"]
        timerMode:
          description: >-
            Mode for a Timer tile: "countup" for a stopwatch counting elapsed
            time from zero, "countdown" for counting down from timerDuration to
            zero, "pomodoro" for an auto-cycling focus/break timer. Absent or
            null defaults to "countup".
          type: ["string", "null"]
          enum: ["countup", "countdown", "pomodoro", null]
        timerDuration:
          description: >-
            Starting duration in seconds for a countdown Timer tile. Ignored in
            count-up mode. Null or absent defaults to a sensible value.
          type: ["integer", "null"]
        timerRunning:
          description: >-
            Whether a Timer tile is currently running. When true the live
            display advances from timerStartedAt; when false it is paused at
            timerAccumulatedMs. Absent or false means paused (the default).
          type: ["boolean", "null"]
        timerStartedAt:
          description: >-
            Epoch milliseconds when the Timer tile's current run segment began.
            Combined with timerAccumulatedMs this lets the live display resume
            accurately after a refresh or page navigation. Null or absent when
            the timer is paused.
          type: ["integer", "null"]
        timerAccumulatedMs:
          description: >-
            Elapsed milliseconds accumulated across previous run segments of a
            Timer tile (i.e. before timerStartedAt). Null or absent means zero.
          type: ["integer", "null"]
        pomodoroFocusMinutes:
          description: >-
            Length in minutes of a focus interval for a Timer tile in pomodoro
            mode. Null or absent defaults to 25.
          type: ["integer", "null"]
        pomodoroShortBreakMinutes:
          description: >-
            Length in minutes of a short break for a Timer tile in pomodoro
            mode. Null or absent defaults to 5.
          type: ["integer", "null"]
        pomodoroLongBreakMinutes:
          description: >-
            Length in minutes of the long break for a Timer tile in pomodoro
            mode. Null or absent defaults to 15.
          type: ["integer", "null"]
        pomodoroSessionsBeforeLongBreak:
          description: >-
            How many focus sessions complete before a Timer tile in pomodoro
            mode runs a long break. Null or absent defaults to 4.
          type: ["integer", "null"]
        pomodoroPhase:
          description: >-
            Current phase of a Timer tile in pomodoro mode: "focus", a
            "shortBreak", or the "longBreak". Combined with the anchor timestamp
            this lets the live display resume the correct phase after a refresh
            or page navigation. Null or absent defaults to "focus".
          type: ["string", "null"]
          enum: ["focus", "shortBreak", "longBreak", null]
        pomodoroCompletedSessions:
          description: >-
            Number of focus sessions completed in the current pomodoro cycle for
            a Timer tile (resets to zero after a long break). Null or absent
            means zero.
          type: ["integer", "null"]
        timerAlertEnabled:
          description: >-
            Whether a Timer tile alerts on completion (countdown) or phase change
            (pomodoro) by playing a sound and/or firing a browser notification.
            Null or absent means disabled.
          type: ["boolean", "null"]
        timerAlertSound:
          description: >-
            Which alert sound a Timer tile plays when it alerts: "chime",
            "bell", "beep", or "digital", or "none" for a browser notification
            only. Honored for both countdown completion and pomodoro phase
            transitions. Null or absent defaults to "chime".
          type: ["string", "null"]
          enum: ["chime", "bell", "beep", "digital", "none", null]
        diceType:
          description: >-
            Die type for a Dice Roller tile, e.g. "d4", "d6", "d20". The number
            after the "d" is the number of sides each die has. Null or absent
            defaults to "d6".
          type: ["string", "null"]
          enum: ["d3", "d4", "d6", "d8", "d10", "d12", "d20", "d100", null]
        diceCount:
          description: >-
            How many dice a Dice Roller tile rolls at once (1-6). Null or absent
            defaults to 2.
          type: ["integer", "null"]
        petHunger:
          description: >-
            A Tamagotchi pet tile's hunger satisfaction, 0 (starving) to 100
            (full). Decays over real elapsed time and rises when the pet is fed.
            Null or absent starts at a healthy default.
          type: ["number", "null"]
        petHappiness:
          description: >-
            A Tamagotchi pet tile's happiness, 0 (sad) to 100 (delighted).
            Decays over real elapsed time and rises when the pet is played with.
            Null or absent starts at a healthy default.
          type: ["number", "null"]
        petEnergy:
          description: >-
            A Tamagotchi pet tile's energy, 0 (exhausted) to 100 (rested).
            Decays over real elapsed time and rises when the pet rests. Null or
            absent starts at a healthy default.
          type: ["number", "null"]
        petUpdatedAt:
          description: >-
            Epoch milliseconds when a Tamagotchi pet tile's stats were last
            computed. On mount the client recomputes decay from the elapsed
            wall-clock time since this anchor so the pet keeps living across
            reloads and sessions. Null or absent means "just now".
          type: ["integer", "null"]
        petBodyColor:
          description: >-
            A Tamagotchi pet tile's body color: a preset key (e.g. "green",
            "blue", "pink") or a custom #hex value. Null or absent uses the
            default preset.
          type: ["string", "null"]
        petEyes:
          description: >-
            A Tamagotchi pet tile's eye style (e.g. "round", "dot", "happy",
            "sleepy", "star", "wink"). Null or absent uses the default.
          type: ["string", "null"]
        petNose:
          description: >-
            A Tamagotchi pet tile's nose style (e.g. "none", "dot", "round",
            "triangle", "heart"). Null or absent uses the default.
          type: ["string", "null"]
        petMouth:
          description: >-
            A Tamagotchi pet tile's mouth style (e.g. "smile", "neutral",
            "open", "cat", "frown"). Null or absent uses the default.
          type: ["string", "null"]
        bonsaiHydration:
          description: >-
            A Bonsai tile's soil hydration, 0 (bone dry) to 100 (well watered).
            Slowly drops over real elapsed time and rises when the tree is
            watered. Null or absent starts at a healthy default.
          type: ["number", "null"]
        bonsaiOvergrowth:
          description: >-
            A Bonsai tile's overgrowth, 0 (freshly pruned / tidy) to 100 (wild
            and untidy). Slowly rises over real elapsed time and is cut back
            when the tree is pruned. Null or absent starts at a tidy default.
          type: ["number", "null"]
        bonsaiGrowth:
          description: >-
            A Bonsai tile's accumulated growth progress, 0 to 100, which drives
            its visible growth stage (sapling -> young -> mature). Advances
            while the tree is kept healthy and stalls or slowly regresses when
            neglected. Null or absent starts at 0 (a fresh sapling).
          type: ["number", "null"]
        bonsaiUpdatedAt:
          description: >-
            Epoch milliseconds when a Bonsai tile's state was last computed. On
            mount the client recomputes hydration/overgrowth/growth from the
            elapsed wall-clock time since this anchor so the tree keeps living
            across reloads and sessions. Null or absent means "just now".
          type: ["integer", "null"]
        bonsaiPotColor:
          description: >-
            A Bonsai tile's pot color: a preset key (e.g. "terracotta", "slate",
            "glazed") or a custom #hex value. Cosmetic only. Null or absent uses
            the default preset.
          type: ["string", "null"]
        bonsaiLeafColor:
          description: >-
            A Bonsai tile's foliage color: a preset key (e.g. "green",
            "emerald", "maple") or a custom #hex value. The chosen color is the
            healthy tone; the tree still fades toward dry tan when thirsty.
            Cosmetic only. Null or absent uses the default preset.
          type: ["string", "null"]
        bonsaiBlossom:
          description: >-
            A Bonsai tile's blossom color: "none" for a plain canopy or a preset
            key (e.g. "pink", "white", "red") that scatters flowers over the
            foliage. Cosmetic only. Null or absent means no blossoms.
          type: ["string", "null"]
        bonsaiStyle:
          description: >-
            A Bonsai tile's tree shape/style (e.g. "upright", "slanted",
            "windswept", "cascade"). Cosmetic only. Null or absent uses the
            default upright style.
          type: ["string", "null"]
        aquariumFishTypes:
          description: >-
            An Aquarium tile's three fish species slots (e.g. "clownfish",
            "bluetang", "angelfish", "pufferfish", "goldfish", "betta"). Each
            slot may be "none" to leave it empty. Null or absent uses the
            defaults.
          type: ["array", "null"]
          items:
            type: string
        aquariumSandColor:
          description: >-
            An Aquarium tile's sand floor color: a preset key (e.g. "tan",
            "white", "dark") or a custom #hex value. Null or absent uses the
            default tan sand.
          type: ["string", "null"]
        aquariumProps:
          description: >-
            An Aquarium tile's three decoration prop slots (e.g. "seaweed",
            "coral", "chest", "anchor", "castle", "rock"). Each slot may be
            "none" to leave it empty. Null or absent uses the defaults.
          type: ["array", "null"]
          items:
            type: string
        visualizerStyle:
          description: >-
            An Audio Visualizer tile's render style: "bars" (frequency bar
            graph), "lava" (morphing lava-lamp blobs), "vu" (retro VU meter),
            "vinyl" (spinning record with album-art label), or "cd" (top-down
            CD player with album-art disc). Null or absent defaults to "bars".
          type: ["string", "null"]
          enum: ["bars", "lava", "vu", "vinyl", "cd", null]
        visualizerPrimary:
          description: >-
            An Audio Visualizer tile's primary accent color as a #hex value —
            the bars/blobs/needles/lit LEDs. Null or absent uses the default.
          type: ["string", "null"]
        visualizerBackground:
          description: >-
            An Audio Visualizer tile's background / glow color as a #hex value —
            the canvas backdrop and halo glow. Null or absent uses the default.
          type: ["string", "null"]
        photoSource:
          description: >-
            Where a Picture Frame tile's photos come from: "uploads" (images
            from the upload library), "urls" (a pasted list of image URLs),
            "google" (a Google Photos album), or "immich" (an Immich album).
            Null or absent means unconfigured — the tile shows demo photos.
          type: ["string", "null"]
          enum: ["uploads", "urls", "google", "immich", null]
        photoUploadUrls:
          description: >-
            The uploaded images (their /api/uploads/files/... URLs) a Picture
            Frame tile cycles through when photoSource is "uploads".
          type: ["array", "null"]
          items:
            type: string
        photoUrls:
          description: >-
            The image URLs a Picture Frame tile cycles through when
            photoSource is "urls".
          type: ["array", "null"]
          items:
            type: string
        photoAlbumId:
          description: >-
            The selected album id for a server-backed photoSource ("google" or
            "immich"). Null or absent means no album chosen yet.
          type: ["string", "null"]
        photoInterval:
          description: >-
            Seconds between automatic slide advances on a Picture Frame tile.
            0 disables auto-advance (manual only). Null or absent uses the
            default (30s).
          type: ["number", "null"]
        photoFit:
          description: >-
            How a Picture Frame tile scales its photos: "cover" (fill, crop)
            or "contain" (letterbox, whole image). Null or absent uses cover.
          type: ["string", "null"]
          enum: ["cover", "contain", null]
        frameStyle:
          description: >-
            A Picture Frame tile's decorative frame: "none", "wood", "thin",
            "gold", "polaroid", or "custom" (uses frameColor/frameWidth). Null
            or absent means no frame.
          type: ["string", "null"]
          enum: ["none", "wood", "thin", "gold", "polaroid", "custom", null]
        frameColor:
          description: >-
            The frame color (#hex) when frameStyle is "custom". Null or absent
            uses a neutral default.
          type: ["string", "null"]
        frameWidth:
          description: >-
            The frame thickness in pixels when frameStyle is "custom". Null or
            absent uses the default.
          type: ["number", "null"]
        videoSource:
          description: >-
            Where a Video Player tile's videos come from: "uploads" (video
            files from the upload library), "urls" (a pasted list of direct
            video file URLs), "youtube" (a YouTube video/playlist embed),
            "plex" or "jellyfin" (a library on the connected media server),
            or "ersatztv" (live TV channels from the connected ErsatzTV
            server). Null or absent means unconfigured — the tile plays the
            built-in yule log stream.
          type: ["string", "null"]
          enum: ["uploads", "urls", "youtube", "plex", "jellyfin", "ersatztv", null]
        videoUploadUrls:
          description: >-
            The uploaded videos (their /api/uploads/files/... URLs) a Video
            Player tile plays when videoSource is "uploads".
          type: ["array", "null"]
          items:
            type: string
        videoUrls:
          description: >-
            The direct video file URLs a Video Player tile plays (in order)
            when videoSource is "urls".
          type: ["array", "null"]
          items:
            type: string
        videoYoutubeUrl:
          description: >-
            The YouTube video or playlist URL a Video Player tile embeds when
            videoSource is "youtube".
          type: ["string", "null"]
        videoLibraryId:
          description: >-
            The selected library/collection id for a media-server videoSource
            ("plex" or "jellyfin"). Null or absent means no library chosen.
          type: ["string", "null"]
        videoErsatzChannel:
          description: >-
            The tuned ErsatzTV channel number when videoSource is "ersatztv".
            Null or absent means the first channel in the lineup.
          type: ["string", "null"]
        videoPlayMode:
          description: >-
            "single" loops the first (or only) video forever; "playlist" plays
            through the list, advancing on end. Null or absent uses playlist.
          type: ["string", "null"]
          enum: ["single", "playlist", null]
        videoPlaylistLoop:
          description: >-
            Whether a Video Player tile restarts the playlist after the last
            video ends (playlist mode). Null or absent defaults to true.
          type: ["boolean", "null"]
        videoShuffle:
          description: >-
            Whether a Video Player tile shuffles the playlist order (playlist
            mode). Null or absent defaults to false.
          type: ["boolean", "null"]
        videoMuted:
          description: >-
            Whether a Video Player tile starts muted. Null or absent defaults
            to true (autoplay-safe).
          type: ["boolean", "null"]
        videoPageSwitchMute:
          description: >-
            Whether a Video Player tile automatically mutes when the user
            switches dashboard pages or browser tabs. Null or absent defaults
            to true.
          type: ["boolean", "null"]
        videoFit:
          description: >-
            How a Video Player tile scales its video: "cover" (fill, crop) or
            "contain" (letterbox, whole frame). Null or absent uses cover.
          type: ["string", "null"]
          enum: ["cover", "contain", null]

    NoteChecklistItem:
      type: object
      required: [text, done]
      properties:
        text:
          description: The checklist item's label text.
          type: string
        done:
          description: >-
            Whether the item is checked off. When true the tile renders it with
            a strike-through.
          type: boolean

    StockWatchEntry:
      type: object
      required: [symbol]
      properties:
        symbol:
          description: Ticker symbol (e.g. "AAPL"), stored uppercased.
          type: string
        shares:
          description: >-
            Optional number of shares held. When present (and > 0) the tile
            shows this row's position value and gain/loss.
          type: ["number", "null"]
        costBasis:
          description: >-
            Optional average cost per share. Used with shares to compute
            gain/loss. Null or absent when not tracking cost.
          type: ["number", "null"]

    EmailMessage:
      type: object
      required: [id, account, accountLabel, from, subject, date, unread]
      properties:
        id:
          description: Provider-scoped message id, unique within the response.
          type: string
        account:
          description: >-
            Key of the account this message came from ("gmail" or an IMAP
            account id).
          type: string
        accountLabel:
          description: Human-readable label of the source account.
          type: string
        from:
          description: Display name (or address) of the sender.
          type: string
        subject:
          description: Message subject line (may be empty).
          type: string
        snippet:
          description: >-
            Short plain-text preview of the message body when the provider
            supplies one. Null when unavailable.
          type: ["string", "null"]
        date:
          description: When the message was received (ISO 8601).
          type: string
        unread:
          description: True when the message is unread.
          type: boolean
        link:
          description: >-
            Deep link to open the message in the provider's web UI (Gmail
            deep link, or the account's configured webmail URL for IMAP).
            Null when unavailable.
          type: ["string", "null"]

    EmailMessageBodyData:
      type: object
      required: [body]
      properties:
        body:
          description: >-
            The message body as sanitized plain text (capped server-side).
            Null when the message has no readable text part.
          type: ["string", "null"]

    EmailArchiveRequest:
      type: object
      required: [id]
      properties:
        id:
          description: The EmailMessage id of the message to archive.
          type: string

    EmailArchiveResponse:
      type: object
      required: [ok]
      properties:
        ok:
          description: True when the message was archived.
          type: boolean

    EmailMarkReadRequest:
      type: object
      required: [id]
      properties:
        id:
          description: The EmailMessage id of the message to mark as read.
          type: string

    EmailMarkReadResponse:
      type: object
      required: [ok]
      properties:
        ok:
          description: True when the message was marked read.
          type: boolean

    EmailAccountError:
      description: A configured account that failed to respond during the fetch.
      type: object
      required: [account, message]
      properties:
        account:
          description: Label of the failing account.
          type: string
        message:
          description: Short human-readable failure reason.
          type: string

    EmailInboxData:
      type: object
      required: [messages, sample]
      properties:
        messages:
          description: Recent messages across the requested accounts, newest first.
          type: array
          items:
            $ref: "#/components/schemas/EmailMessage"
        unreadTotal:
          description: >-
            Total unread count across accounts when the providers report one.
            Null when unknown.
          type: ["integer", "null"]
        errors:
          description: >-
            Accounts that failed during the fetch (partial results). Null or
            absent when every account responded.
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/EmailAccountError"
        sample:
          description: >-
            True when these are demo messages because no mail account is
            configured yet.
          type: boolean

    CalendarEvent:
      type: object
      required: [id, account, accountLabel, title, start, allDay]
      properties:
        id:
          description: Provider-scoped event id, unique within the response.
          type: string
        account:
          description: >-
            Key of the account this event came from ("google" or a CalDAV
            account id).
          type: string
        accountLabel:
          description: Human-readable label of the source account.
          type: string
        calendar:
          description: Name of the calendar the event belongs to, when known.
          type: ["string", "null"]
        title:
          description: Event title/summary.
          type: string
        start:
          description: Event start (ISO 8601; date-only for all-day events).
          type: string
        end:
          description: >-
            Event end (ISO 8601; date-only for all-day events). Null when the
            provider does not supply one.
          type: ["string", "null"]
        allDay:
          description: True for all-day events.
          type: boolean
        location:
          description: Event location when set. Null otherwise.
          type: ["string", "null"]

    CalendarEventsData:
      type: object
      required: [events, sample]
      properties:
        events:
          description: Upcoming events across the requested accounts, soonest first.
          type: array
          items:
            $ref: "#/components/schemas/CalendarEvent"
        errors:
          description: >-
            Accounts that failed during the fetch (partial results). Null or
            absent when every account responded.
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/EmailAccountError"
        sample:
          description: >-
            True when these are demo events because no calendar account is
            configured yet.
          type: boolean

    GoogleStatus:
      type: object
      required: [configured, connected, email]
      properties:
        configured:
          description: >-
            True when OAuth client credentials are available, either from the
            GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET environment variables or
            saved via Settings.
          type: boolean
        connected:
          description: True when at least one Google account is linked and usable.
          type: boolean
        email:
          description: >-
            Email address of the first connected Google account (legacy summary
            field — prefer the accounts list).
          type: ["string", "null"]
        accounts:
          description: Every linked Google account.
          type: array
          items:
            $ref: "#/components/schemas/GoogleAccountStatus"
        redirectUri:
          description: >-
            The exact OAuth redirect URI the Google Cloud project must
            allow-list.
          type: ["string", "null"]
        credentialSource:
          description: >-
            Where the active OAuth client credentials come from: "env"
            (server environment variables, read-only in the UI) or "stored"
            (saved via Settings). Null when not configured.
          type: ["string", "null"]
          enum: [env, stored, null]
        clientId:
          description: >-
            The active OAuth client ID (the secret is never returned). Null
            when not configured.
          type: ["string", "null"]

    GoogleDisconnectInput:
      type: object
      properties:
        accountId:
          description: Id of the single account to unlink.
          type: string

    GoogleAccountStatus:
      type: object
      required: [id, email, connected]
      properties:
        id:
          description: Stable id for this linked account (used in tile account filters).
          type: string
        email:
          description: Email address of the linked account, when known.
          type: ["string", "null"]
        connected:
          description: True when this account's tokens are currently usable.
          type: boolean

    GoogleCredentialsInput:
      type: object
      required: [clientId, clientSecret]
      properties:
        clientId:
          description: OAuth 2.0 client ID from the Google Cloud Console.
          type: string
        clientSecret:
          description: OAuth 2.0 client secret from the Google Cloud Console.
          type: string

    GoogleAuthIntent:
      type: object
      required: [intent]
      properties:
        intent:
          description: >-
            Short-lived single-use token; append as ?intent= to the
            /widgets/gmail/auth popup URL to authorize one OAuth flow run.
          type: string

    AiProvider:
      description: >-
        Supported AI chat providers. "ollama" and "openai_compatible" are
        local/self-hosted servers reached via a base URL (no API key needed).
      type: string
      enum: [openai, gemini, anthropic, ollama, openai_compatible]

    AiAccountInput:
      type: object
      required: [provider]
      properties:
        label:
          description: Display label; defaults to the provider name when empty.
          type: ["string", "null"]
        provider:
          $ref: "#/components/schemas/AiProvider"
        apiKey:
          description: >-
            The provider API key. Stored server-side, never echoed back.
            Required for cloud providers; optional for local ones.
          type: ["string", "null"]
        baseUrl:
          description: >-
            Base URL of a local/self-hosted AI server (e.g.
            "http://192.168.1.10:11434" for Ollama or
            "http://192.168.1.10:1234" for LM Studio). Required for local
            providers, ignored for cloud providers.
          type: ["string", "null"]
        model:
          description: >-
            Default model for this account (e.g. "gpt-4o-mini"). Null or absent
            uses a sensible provider default.
          type: ["string", "null"]

    AiAccountUpdate:
      description: >-
        Partial update for a saved AI account. Absent fields keep their stored
        values; in particular, omitting apiKey keeps the stored key.
      type: object
      properties:
        label:
          type: ["string", "null"]
        provider:
          oneOf:
            - $ref: "#/components/schemas/AiProvider"
            - type: "null"
        apiKey:
          type: ["string", "null"]
        baseUrl:
          type: ["string", "null"]
        model:
          type: ["string", "null"]

    AiAccount:
      description: A saved AI account as returned to the browser (key masked).
      type: object
      required: [id, label, provider, maskedKey]
      properties:
        id:
          type: string
        label:
          type: string
        provider:
          $ref: "#/components/schemas/AiProvider"
        maskedKey:
          description: >-
            Masked API key hint (last 4 characters at most). Empty for local
            keyless accounts.
          type: string
        baseUrl:
          description: Base URL of a local/self-hosted server, if any.
          type: ["string", "null"]
        model:
          type: ["string", "null"]

    AiTestResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean
        message:
          type: ["string", "null"]

    AiChatMessage:
      type: object
      required: [role, content]
      properties:
        role:
          type: string
          enum: [user, assistant]
        content:
          type: string

    AiChatRequest:
      type: object
      required: [messages]
      properties:
        accountId:
          description: >-
            The saved AI account to chat through. May be omitted only when no
            accounts are configured at all (demo mode).
          type: ["string", "null"]
        model:
          description: Optional per-tile model override.
          type: ["string", "null"]
        messages:
          description: The conversation so far, oldest first.
          type: array
          items:
            $ref: "#/components/schemas/AiChatMessage"
        stream:
          description: >-
            When true the response is a chunked NDJSON stream
            (application/x-ndjson): one {"delta": "…"} line per piece of
            reply text, ending with {"done": true, "sample": bool, "model":
            "…"} — or {"error": "…"} if the provider fails mid-stream.
          type: ["boolean", "null"]

    AiChatReply:
      type: object
      required: [sample, reply, model]
      properties:
        sample:
          description: True when this is a demo reply (no accounts configured).
          type: boolean
        reply:
          type: string
        model:
          description: The model that produced the reply.
          type: string

    AiModelList:
      type: object
      required: [provider, models, live]
      properties:
        provider:
          $ref: "#/components/schemas/AiProvider"
        models:
          type: array
          items:
            type: string
        live:
          description: >-
            True when the list came live from the provider; false when it is
            the static fallback list.
          type: boolean
        default:
          description: The account's saved default model, if any.
          type: ["string", "null"]

    ImapAccountInput:
      type: object
      required: [host, username, password]
      properties:
        label:
          description: Friendly display name; defaults to the username.
          type: ["string", "null"]
        host:
          description: IMAP server hostname (e.g. "imap.example.com").
          type: string
        port:
          description: IMAP port; defaults to 993.
          type: ["integer", "null"]
        secure:
          description: Use implicit TLS; defaults to true.
          type: ["boolean", "null"]
        username:
          description: IMAP login username.
          type: string
        password:
          description: IMAP login password (stored server-side, never returned).
          type: string
        webmailUrl:
          description: >-
            Optional http(s) URL of the provider's webmail UI. When set,
            messages from this account link to it from the Email tile.
          type: ["string", "null"]

    ImapAccount:
      type: object
      required: [id, label, host, port, secure, username, webmailUrl]
      properties:
        id:
          description: Stable id for this saved account.
          type: string
        label:
          description: Friendly display name.
          type: string
        host:
          type: string
        port:
          type: integer
        secure:
          type: boolean
        username:
          type: string
        webmailUrl:
          description: >-
            Webmail URL messages from this account link to. Null when not
            configured.
          type: ["string", "null"]

    CalDavAccountInput:
      type: object
      required: [url, username, password]
      properties:
        label:
          description: Friendly display name; defaults to the username.
          type: ["string", "null"]
        url:
          description: >-
            CalDAV server URL (e.g. "https://cal.example.com/dav" or a
            provider's caldav endpoint).
          type: string
        username:
          description: CalDAV login username.
          type: string
        password:
          description: CalDAV login password (stored server-side, never returned).
          type: string

    CalDavAccount:
      type: object
      required: [id, label, url, username]
      properties:
        id:
          description: Stable id for this saved account.
          type: string
        label:
          description: Friendly display name.
          type: string
        url:
          type: string
        username:
          type: string

    StockQuote:
      type: object
      required: [symbol, price, change, changePercent]
      properties:
        symbol:
          description: The ticker symbol this quote is for (uppercased).
          type: string
        name:
          description: >-
            Human-readable company/ETF name when available. Null when the
            provider does not return one.
          type: ["string", "null"]
        price:
          description: Latest/current price.
          type: number
        change:
          description: Absolute price change since the previous close.
          type: number
        changePercent:
          description: Percent price change since the previous close.
          type: number

    StockData:
      type: object
      required: [quotes, sample]
      properties:
        quotes:
          description: One quote per requested symbol that resolved successfully.
          type: array
          items:
            $ref: "#/components/schemas/StockQuote"
        sample:
          description: >-
            True when the quotes are built-in sample data (no provider API key
            configured), so the tile can label them as not-live.
          type: boolean

    StockSearchResult:
      type: object
      required: [symbol, description]
      properties:
        symbol:
          description: Ticker symbol to add to a watchlist.
          type: string
        description:
          description: Company/ETF name or description for the symbol.
          type: string

    StockSearchData:
      type: object
      required: [results, sample]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/StockSearchResult"
        sample:
          description: >-
            True when the results are built-in sample matches (no provider API
            key configured).
          type: boolean

    StockCandleSeries:
      type: object
      required: [symbol, closes]
      properties:
        symbol:
          description: The ticker symbol this series is for (uppercased).
          type: string
        closes:
          description: >-
            Recent daily closing prices in chronological order (oldest first),
            suitable for rendering an inline sparkline.
          type: array
          items:
            type: number

    StockCandlesData:
      type: object
      required: [series, sample]
      properties:
        series:
          description: One closing-price series per requested symbol that resolved.
          type: array
          items:
            $ref: "#/components/schemas/StockCandleSeries"
        sample:
          description: >-
            True when the series are built-in sample data (no provider API key
            configured), so the tile can label them as not-live.
          type: boolean

    WeatherDailyForecast:
      type: object
      required: [date, code]
      properties:
        date:
          description: Forecast date as YYYY-MM-DD (in the location's timezone).
          type: string
        code:
          description: WMO weather code for the day's dominant conditions.
          type: integer
        high:
          description: Daily high temperature in the requested units.
          type: ["number", "null"]
        low:
          description: Daily low temperature in the requested units.
          type: ["number", "null"]

    WeatherWidgetData:
      type: object
      required: [name, temp, feels, code, isDay, forecast]
      properties:
        name:
          description: >-
            Resolved place name — reverse-geocoded for coordinates, or the
            geocoded match ("City, Country") for a typed city.
          type: string
        temp:
          description: Current temperature in the requested units.
          type: number
        feels:
          description: Current apparent ("feels like") temperature.
          type: number
        code:
          description: Current WMO weather code.
          type: integer
        isDay:
          description: True when it is currently daytime at the location.
          type: boolean
        high:
          description: Today's high temperature.
          type: ["number", "null"]
        low:
          description: Today's low temperature.
          type: ["number", "null"]
        forecast:
          description: >-
            Daily forecast entries in chronological order, starting with today.
          type: array
          items:
            $ref: "#/components/schemas/WeatherDailyForecast"

    LayoutItem:
      type: object
      required: [id, gridX, gridY, gridW, gridH]
      properties:
        id:
          type: integer
        gridX:
          type: integer
        gridY:
          type: integer
        gridW:
          type: integer
        gridH:
          type: integer

    LayoutUpdate:
      type: object
      required: [tiles]
      properties:
        pageId:
          description: >-
            The page whose layout is being saved. When provided, the response
            returns only that page's tiles; omit for all of the user's tiles.
          type: ["integer", "null"]
        deviceModeId:
          description: >-
            When provided with pageId, the response is narrowed to that device
            mode's layout (matching GET /tiles for the same scope).
          type: ["integer", "null"]
        variant:
          description: >-
            Adaptive layout variant key that further narrows the response
            scope, used with deviceModeId. Omit or null for the base layout.
          type: ["string", "null"]
        tiles:
          type: array
          items:
            $ref: "#/components/schemas/LayoutItem"

    Page:
      type: object
      required: [id, userId, name, position]
      properties:
        id:
          type: integer
        userId:
          type: integer
        name:
          type: string
        position:
          type: integer
        layoutPreset:
          description: >-
            Fixed scale preset that maps to a locked column count. "auto" (the
            default) keeps today's responsive behavior (columns derived from
            window width). "adaptive" auto-resolves a fixed preset and
            orientation from the viewport, with an independently saved layout
            per scale+orientation variant. Any other value locks the page to a
            fixed column count that is CSS-scaled to fit the viewport so tiles
            never reflow.
          type: string
          enum: [auto, adaptive, compact, fhd, qhd, uhd]
        layoutOrientation:
          description: >-
            How a fixed-preset page is scaled to fit. "landscape" fits to width,
            "portrait" fits to height. Ignored when layoutPreset is "auto".
          type: string
          enum: [landscape, portrait]
        createdAt:
          type: string

    PageInput:
      type: object
      properties:
        name:
          type: string
        layoutPreset:
          type: string
          enum: [auto, adaptive, compact, fhd, qhd, uhd]
        layoutOrientation:
          type: string
          enum: [landscape, portrait]

    PageReorder:
      type: object
      required: [order]
      properties:
        order:
          description: Page ids in the desired display order.
          type: array
          items:
            type: integer

    ExportedTile:
      description: >-
        A tile inside an export envelope. Mirrors Tile but omits every identity
        field (id, userId, pageId, createdAt) so it can be re-imported under any
        user/page. Carries no credential data — integrations are referenced by
        type only.
      type: object
      required: [type, gridX, gridY, gridW, gridH]
      properties:
        type:
          type: string
        integration:
          type: ["string", "null"]
        gridX:
          type: integer
        gridY:
          type: integer
        gridW:
          type: integer
        gridH:
          type: integer
        name:
          type: ["string", "null"]
        url:
          type: ["string", "null"]
        bgColor:
          type: ["string", "null"]
        imageUrl:
          type: ["string", "null"]
        imageFit:
          type: ["string", "null"]
        imagePosition:
          type: ["string", "null"]
        imageScale:
          type: ["integer", "null"]
        titleSize:
          type: ["string", "null"]
        titlePosition:
          type: ["string", "null"]
        titleColor:
          type: ["string", "null"]
        hideTitle:
          type: boolean
        metrics:
          type: ["array", "null"]
          items:
            type: string
        tileSettings:
          $ref: "#/components/schemas/TileSettings"

    ExportedPage:
      description: A single page within an export envelope.
      type: object
      required: [name, tiles]
      properties:
        name:
          type: string
        layoutPreset:
          type: string
          enum: [auto, adaptive, compact, fhd, qhd, uhd]
        layoutOrientation:
          type: string
          enum: [landscape, portrait]
        tiles:
          description: >-
            Flat list of every tile on the page across all device modes and
            variants. v1 importers read this; v2 importers prefer `layouts`
            when present.
          type: array
          items:
            $ref: "#/components/schemas/ExportedTile"
        layouts:
          description: >-
            v2 only. The page's tiles grouped per (device mode, variant)
            layout scope, with modes referenced by name so they can be matched
            or recreated on import.
          type: array
          items:
            $ref: "#/components/schemas/ExportedLayout"

    ExportedLayout:
      description: >-
        One (device mode, variant) layout scope of a page inside a v2 export
        envelope.
      type: object
      required: [deviceMode, tiles]
      properties:
        deviceMode:
          description: Device mode name (matched case-insensitively on import).
          type: string
        variant:
          description: >-
            Adaptive variant key (e.g. "fhd-landscape"); null for the base
            layout.
          type: ["string", "null"]
        tiles:
          type: array
          items:
            $ref: "#/components/schemas/ExportedTile"

    SuccessResponse:
      type: object
      required: [success]
      properties:
        success:
          type: boolean

    DeviceMode:
      description: >-
        A named, user-created layout profile (e.g. "PC", "Phone"). Every tile
        belongs to exactly one device mode; switching modes switches the whole
        dashboard's tile set.
      type: object
      required: [id, userId, name, position]
      properties:
        id:
          type: integer
        userId:
          type: integer
        name:
          type: string
        position:
          type: integer
        createdAt:
          type: string

    DeviceModeInput:
      type: object
      required: [name]
      properties:
        name:
          description: Display name for the device mode (trimmed, max 40 chars).
          type: string

    PageLayoutInfo:
      description: >-
        One non-empty (device mode, variant) layout scope on a page, with its
        tile count. Feeds the "copy layout from…" picker.
      type: object
      required: [deviceModeId, variant, tileCount]
      properties:
        deviceModeId:
          type: ["integer", "null"]
        variant:
          type: ["string", "null"]
        tileCount:
          type: integer

    CopyLayoutBody:
      description: >-
        Source and target layout scopes for copying a page's tiles. The target
        scope must be empty unless replace is true, in which case its existing
        tiles are deleted and replaced by the copy.
      type: object
      required: [fromDeviceModeId, toDeviceModeId]
      properties:
        fromDeviceModeId:
          type: integer
        fromVariant:
          type: ["string", "null"]
        toDeviceModeId:
          type: integer
        toVariant:
          type: ["string", "null"]
        replace:
          description: >-
            When true, delete any tiles already in the target scope and
            replace them with the copied layout.
          type: boolean

    CopyLayoutResult:
      type: object
      required: [copied]
      properties:
        copied:
          description: Number of tiles copied into the target layout.
          type: integer

    PageExport:
      description: >-
        A versioned envelope holding one or more dashboard pages and their
        tiles. Used both as the export download and the import upload body. The
        format/version fields let importers reject incompatible files. Never
        contains service connection credentials.
      type: object
      required: [format, version, pages]
      properties:
        format:
          description: Constant identifier for this file type.
          type: string
        version:
          description: Schema version, bumped on incompatible format changes.
          type: integer
        exportedAt:
          description: ISO timestamp of when the file was produced.
          type: string
        pages:
          type: array
          items:
            $ref: "#/components/schemas/ExportedPage"

    ProfileDeviceMode:
      description: A device mode inside a profile export, referenced by name.
      type: object
      required: [name]
      properties:
        name:
          type: string

    ExportedConnection:
      description: >-
        A service connection inside a profile export. ONLY present when the
        user explicitly opted in to including credentials — every field is
        stored and exported in readable plain text.
      type: object
      required: [service]
      properties:
        service:
          type: string
        url:
          type: ["string", "null"]
        apiKey:
          type: ["string", "null"]
        username:
          type: ["string", "null"]
        password:
          type: ["string", "null"]
        extra:
          description: >-
            Opaque JSON blob carrying service-specific extras (tokens,
            IMAP/CalDAV account lists).
          type: ["string", "null"]

    ProfileExport:
      description: >-
        A versioned envelope holding a user's entire profile — device modes,
        pages with per-mode/variant tile layouts, and (only when explicitly
        requested) service connection credentials. The client additionally
        merges browser-side theme data into the downloaded file.
      type: object
      required: [format, version, deviceModes, pages]
      properties:
        format:
          description: Constant identifier for this file type.
          type: string
        version:
          description: Schema version, bumped on incompatible format changes.
          type: integer
        exportedAt:
          description: ISO timestamp of when the file was produced.
          type: string
        deviceModes:
          type: array
          items:
            $ref: "#/components/schemas/ProfileDeviceMode"
        pages:
          type: array
          items:
            $ref: "#/components/schemas/ExportedPage"
        connections:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/ExportedConnection"

    ProfileImportBody:
      description: >-
        A profile export envelope plus the import mode. "replace" wipes the
        account's pages/tiles/device modes (and connections, if the file
        includes them) and recreates them from the file; "merge" appends pages
        and device modes with de-duplicated names.
      type: object
      required: [format, version, deviceModes, pages, mode]
      properties:
        format:
          type: string
        version:
          type: integer
        mode:
          type: string
          enum: [replace, merge]
        deviceModes:
          type: array
          items:
            $ref: "#/components/schemas/ProfileDeviceMode"
        pages:
          type: array
          items:
            $ref: "#/components/schemas/ExportedPage"
        connections:
          type: ["array", "null"]
          items:
            $ref: "#/components/schemas/ExportedConnection"

    ProfileImportResult:
      description: Counts of what an import created/applied.
      type: object
      required: [mode, pages, tiles, deviceModes, connections]
      properties:
        mode:
          type: string
        pages:
          type: integer
        tiles:
          type: integer
        deviceModes:
          type: integer
        connections:
          type: integer

    UploadResult:
      type: object
      required: [url]
      properties:
        url:
          type: string

    UploadedFile:
      type: object
      required: [id, url]
      properties:
        id:
          type: integer
        url:
          type: string
        originalName:
          type: ["string", "null"]
        mimetype:
          type: ["string", "null"]
        size:
          type: ["integer", "null"]
        createdAt:
          type: ["string", "null"]

    UploadUsage:
      type: object
      required: [usedBytes, capBytes]
      properties:
        usedBytes:
          type: integer
          description: Total bytes of stored uploads across all users.
        capBytes:
          type: integer
          description: Configured total upload storage cap in bytes.

    ServiceConnection:
      type: object
      required: [service]
      properties:
        service:
          type: string
        url:
          type: ["string", "null"]
        apiKey:
          type: ["string", "null"]
        username:
          type: ["string", "null"]
        password:
          type: ["string", "null"]
        token:
          type: ["string", "null"]
        updatedAt:
          type: ["string", "null"]

    ServiceConnectionUpdate:
      type: object
      properties:
        url:
          type: string
        apiKey:
          type: string
        username:
          type: string
        password:
          type: string
        token:
          type: string

    ConnectionTestResult:
      type: object
      required: [ok, message]
      properties:
        ok:
          type: boolean
        message:
          type: string

    SpotifyCredentialsInput:
      type: object
      required: [clientId, clientSecret]
      properties:
        clientId:
          description: The Spotify application's Client ID.
          type: string
        clientSecret:
          description: The Spotify application's Client Secret.
          type: string

    SpotifyStatus:
      type: object
      required: [configured, connected, redirectUri]
      properties:
        configured:
          description: True once a Client ID and Client Secret have been saved.
          type: boolean
        connected:
          description: True once a Spotify user account has been linked via OAuth.
          type: boolean
        premium:
          description: >-
            Whether the linked account is Spotify Premium (required for
            in-browser Web Playback SDK streaming). Null when not connected.
          type: ["boolean", "null"]
        displayName:
          description: The linked Spotify account's display name. Null when not connected.
          type: ["string", "null"]
        redirectUri:
          description: >-
            The exact OAuth redirect URI the user must add to their Spotify app's
            allow-list. Derived from the request origin.
          type: string

    SpotifyAuthInput:
      type: object
      required: [origin]
      properties:
        origin:
          description: >-
            The dashboard's browser origin (e.g. "https://example.repl.co"), used
            to build the OAuth redirect URI that points back at this server.
          type: string

    SpotifyAuthUrl:
      type: object
      required: [url]
      properties:
        url:
          description: The Spotify accounts authorize URL the browser should navigate to.
          type: string

    SpotifyToken:
      type: object
      required: [accessToken, expiresAt]
      properties:
        accessToken:
          description: A short-lived Spotify access token, or null when not linked.
          type: ["string", "null"]
        expiresAt:
          description: Unix epoch (ms) at which the access token expires. Null when not linked.
          type: ["number", "null"]

    SpotifyCommandInput:
      type: object
      required: [action]
      properties:
        action:
          description: >-
            The remote-control action to perform on the active Spotify device.
            "transfer" moves playback to the given deviceId (used to start
            in-browser Web Playback SDK streaming).
          type: string
          enum: [play, pause, next, previous, transfer]
        deviceId:
          description: Target device id, required for "transfer".
          type: ["string", "null"]

    SpotifyCommandResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean

    SubsonicScrobbleInput:
      type: object
      required: [id]
      properties:
        id:
          description: The Subsonic song id the dashboard is/was streaming.
          type: string
          minLength: 1
        submission:
          description: >-
            false (default) registers a "now playing" ping that refreshes the
            dashboard's live session without incrementing play counts; true
            registers a completed play (a real scrobble) and bumps play counts.
          type: boolean

    SubsonicScrobbleResult:
      type: object
      required: [ok]
      properties:
        ok:
          type: boolean

    AudioFavoriteInput:
      type: object
      required: [id, liked]
      properties:
        source:
          description: >-
            Which music source the track belongs to. "plex" sets the track's
            user rating, "subsonic" stars/unstars it on Navidrome/Subsonic, and
            "jellyfin" adds/removes it from favorites. Defaults to "plex".
          type: string
          enum: [plex, subsonic, jellyfin]
        id:
          description: The source track id to favorite or unfavorite.
          type: string
          minLength: 1
        liked:
          description: >-
            true to mark the track as a favorite on the source, false to remove
            the favorite.
          type: boolean

    AudioFavoriteResult:
      type: object
      required: [liked]
      properties:
        liked:
          description: The track's favorite state after the change was applied.
          type: boolean

    ServiceStatus:
      type: object
      required: [service, configured, ok, message, checkedAt]
      properties:
        service:
          type: string
        configured:
          type: boolean
        ok:
          type: boolean
        message:
          type: string
        checkedAt:
          description: When this reachability check ran (ISO 8601).
          type: string

    ConnectionHealth:
      type: object
      required: [service, ok, message, checkedAt]
      properties:
        service:
          type: string
        ok:
          type: boolean
        message:
          type: string
        checkedAt:
          type: string

    TruenasMetrics:
      type: object
      required: [cpuPercent, memUsedGb, memTotalGb, pools, disks]
      properties:
        cpuPercent:
          type: number
        memUsedGb:
          type: number
        memTotalGb:
          type: number
        netInMbps:
          description: Inbound network throughput in megabits/sec; null when the reporting graph is unavailable.
          type: ["number", "null"]
        netOutMbps:
          description: Outbound network throughput in megabits/sec; null when the reporting graph is unavailable.
          type: ["number", "null"]
        arcHitRatio:
          description: ZFS ARC hit ratio as a percentage (0-100); null when the reporting graph is unavailable.
          type: ["number", "null"]
        arcSizeGb:
          description: ZFS ARC size in gigabytes; null when the reporting graph is unavailable.
          type: ["number", "null"]
        netInSeries:
          description: >-
            Recent inbound throughput samples (Mbps), oldest first, for an inline
            sparkline. Empty when the reporting graph is unavailable.
          type: array
          items:
            type: number
        netOutSeries:
          description: >-
            Recent outbound throughput samples (Mbps), oldest first, for an inline
            sparkline. Empty when the reporting graph is unavailable.
          type: array
          items:
            type: number
        arcHitSeries:
          description: >-
            Recent ZFS ARC hit-ratio samples (percent, 0-100), oldest first, for
            an inline sparkline. Empty when the reporting graph is unavailable.
          type: array
          items:
            type: number
        cpuTempC:
          description: >-
            Current CPU temperature in °C (the hottest core), from the cputemp
            reporting graph; null when the box exposes no CPU temperature sensor
            or the reporting call is unavailable.
          type: ["number", "null"]
        cpuTempCoresC:
          description: >-
            Per-core CPU temperatures in °C for the current reading. Empty when
            no CPU temperature sensor is exposed or the reporting call is
            unavailable.
          type: array
          items:
            type: number
        pools:
          type: array
          items:
            $ref: "#/components/schemas/ZfsPool"
        disks:
          type: array
          items:
            $ref: "#/components/schemas/TruenasDisk"

    ZfsPool:
      type: object
      required: [name, status, usedBytes, totalBytes]
      properties:
        name:
          type: string
        status:
          type: string
        usedBytes:
          type: number
        totalBytes:
          type: number

    TruenasDisk:
      type: object
      required: [name, temperatureC, smartPassed]
      properties:
        name:
          type: string
        temperatureC:
          type: ["number", "null"]
        smartPassed:
          type: ["boolean", "null"]

    MediaItem:
      type: object
      required: [id, title, type]
      properties:
        id:
          type: string
        title:
          type: string
        type:
          type: string
        year:
          type: ["integer", "null"]
        thumb:
          type: ["string", "null"]
        addedAt:
          type: ["string", "null"]
        seriesName:
          type: ["string", "null"]
        seasonLabel:
          type: ["string", "null"]
        url:
          type: ["string", "null"]

    ContinueWatchingItem:
      type: object
      required: [id, title]
      properties:
        id:
          type: string
        title:
          type: string
        type:
          type: ["string", "null"]
        seriesName:
          type: ["string", "null"]
        thumb:
          type: ["string", "null"]
        progress:
          type: ["number", "null"]
        url:
          type: ["string", "null"]

    SonarrData:
      type: object
      required: [queue, upcoming]
      properties:
        queue:
          type: array
          items:
            $ref: "#/components/schemas/SonarrQueueItem"
        upcoming:
          type: array
          items:
            $ref: "#/components/schemas/SonarrUpcomingItem"

    SonarrQueueItem:
      type: object
      required: [id, title, status]
      properties:
        id:
          type: integer
        title:
          type: string
        status:
          type: string
        progress:
          type: ["number", "null"]
        size:
          type: ["number", "null"]

    SonarrUpcomingItem:
      type: object
      required: [id, title, airDate]
      properties:
        id:
          type: integer
        title:
          type: string
        seriesTitle:
          type: string
        airDate:
          type: string
        seasonNumber:
          type: ["integer", "null"]
        episodeNumber:
          type: ["integer", "null"]

    RadarrData:
      type: object
      required: [queue, upcoming]
      properties:
        queue:
          type: array
          items:
            $ref: "#/components/schemas/RadarrQueueItem"
        upcoming:
          type: array
          items:
            $ref: "#/components/schemas/RadarrUpcomingItem"

    RadarrQueueItem:
      type: object
      required: [id, title, status]
      properties:
        id:
          type: integer
        title:
          type: string
        status:
          type: string
        progress:
          type: ["number", "null"]
        size:
          type: ["number", "null"]

    RadarrUpcomingItem:
      type: object
      required: [id, title, releaseDate]
      properties:
        id:
          type: integer
        title:
          type: string
        releaseDate:
          type: string
        year:
          type: ["integer", "null"]

    LidarrData:
      type: object
      required: [queue, upcoming]
      properties:
        queue:
          type: array
          items:
            $ref: "#/components/schemas/LidarrQueueItem"
        upcoming:
          type: array
          items:
            $ref: "#/components/schemas/LidarrUpcomingItem"

    LidarrQueueItem:
      type: object
      required: [id, title, status]
      properties:
        id:
          type: integer
        title:
          type: string
        status:
          type: string
        progress:
          type: ["number", "null"]
        size:
          type: ["number", "null"]

    LidarrUpcomingItem:
      type: object
      required: [id, title, releaseDate]
      properties:
        id:
          type: integer
        title:
          type: string
        artistName:
          type: string
        releaseDate:
          type: string

    QbittorrentData:
      type: object
      required: [torrents, downloadSpeed, uploadSpeed, categories]
      properties:
        torrents:
          type: array
          items:
            $ref: "#/components/schemas/QbittorrentTorrent"
        downloadSpeed:
          type: number
        uploadSpeed:
          type: number
        categories:
          description: >-
            All category names defined in qBittorrent, including categories
            that currently have no active torrents. Sourced from qBittorrent's
            dedicated categories endpoint so the tile filter can list every
            category even when nothing is downloading or seeding.
          type: array
          items:
            type: string

    QbittorrentTorrent:
      type: object
      required: [name, progress, state, dlSpeed, upSpeed, category]
      properties:
        name:
          type: string
        progress:
          type: number
        state:
          type: string
        dlSpeed:
          type: number
        upSpeed:
          type: number
        category:
          description: >-
            The qBittorrent category assigned to this torrent, or an empty
            string when uncategorized.
          type: string

    PiholeData:
      type: object
      required: [queriesTotal, adsBlocked, adsPercentage, domainsBlocked, status]
      properties:
        queriesTotal:
          type: number
        adsBlocked:
          type: number
        adsPercentage:
          type: number
        domainsBlocked:
          type: number
        status:
          type: string
          enum: [enabled, disabled]

    NginxProxyManagerData:
      type: object
      required: [total, enabled, offline, deadHostsCount, expiringCertsCount, proxyHosts]
      properties:
        total:
          description: Total number of configured proxy hosts.
          type: integer
        enabled:
          description: Number of enabled proxy hosts.
          type: integer
        offline:
          description: Number of enabled proxy hosts Nginx reports as offline.
          type: integer
        deadHostsCount:
          description: Number of 404 (dead) hosts configured.
          type: integer
        expiringCertsCount:
          description: Number of proxy hosts whose SSL certificate is expired or expiring soon.
          type: integer
        proxyHosts:
          type: array
          items:
            $ref: "#/components/schemas/NginxProxyHost"

    NginxProxyHost:
      type: object
      required: [id, domainNames, enabled, online, ssl, sslExpiring]
      properties:
        id:
          type: integer
        domainNames:
          type: array
          items:
            type: string
        enabled:
          type: boolean
        online:
          type: boolean
        ssl:
          description: Whether the host has an SSL certificate attached.
          type: boolean
        sslExpiring:
          description: Whether the attached SSL certificate is expired or expiring soon.
          type: boolean

    ProwlarrData:
      type: object
      required: [indexers, grabCount24h, healthIssues]
      properties:
        indexers:
          type: array
          items:
            $ref: "#/components/schemas/ProwlarrIndexer"
        grabCount24h:
          description: Number of releases grabbed across all indexers in the last 24 hours.
          type: integer
        healthIssues:
          type: array
          items:
            $ref: "#/components/schemas/ProwlarrHealthIssue"

    ProwlarrIndexer:
      type: object
      required: [id, name, enabled, status]
      properties:
        id:
          type: integer
        name:
          type: string
        enabled:
          description: Whether the indexer is enabled in Prowlarr.
          type: boolean
        status:
          description: >-
            Reachability of an enabled indexer. "ok" when reachable; "failing"
            when Prowlarr reports it as unavailable due to recent failures.
            Disabled indexers report "ok" but render grey via the enabled flag.
          type: string
          enum: [ok, failing]

    ProwlarrHealthIssue:
      type: object
      required: [source, type, message]
      properties:
        source:
          type: string
        type:
          type: string
        message:
          type: string

    PterodactylData:
      type: object
      required: [servers]
      properties:
        servers:
          type: array
          items:
            $ref: "#/components/schemas/PterodactylServer"

    PterodactylServer:
      type: object
      required: [id, name, state, cpuPercent, memUsedMb, memLimitMb, players, playersUnavailableReason]
      properties:
        id:
          description: The server's short identifier from the panel.
          type: string
        name:
          type: string
        state:
          description: >-
            Live power state from the panel's resources endpoint. "unknown"
            when the per-server resources call failed (the row still renders).
          type: string
          enum: [running, starting, stopping, offline, unknown]
        cpuPercent:
          description: Current absolute CPU usage percent, or null when unknown.
          type: ["number", "null"]
        memUsedMb:
          description: Current memory usage in MiB, or null when unknown.
          type: ["number", "null"]
        memLimitMb:
          description: Configured memory limit in MiB, or null when unlimited/unknown.
          type: ["number", "null"]
        players:
          description: >-
            Live player occupancy queried directly from the game server (the
            panel API has no player data). Null when the server is not running,
            the game could not be identified, or the query failed.
          oneOf:
            - $ref: "#/components/schemas/PterodactylPlayers"
            - type: "null"
        playersUnavailableReason:
          description: >-
            Why the player count is missing for a RUNNING server: the game
            could not be identified from the panel metadata, the server has no
            usable public allocation, the query host was unreachable, or
            nothing answered on the query port. Null when players are present
            or the server is not running.
          oneOf:
            - type: string
              enum: [unknown-game, no-allocation, unreachable, timeout]
            - type: "null"

    PterodactylPlayers:
      type: object
      required: [current, max]
      properties:
        current:
          description: Number of players currently connected.
          type: number
        max:
          description: Configured player slot limit, or null when unknown.
          type: ["number", "null"]

    PterodactylPowerRequest:
      type: object
      required: [serverId, signal]
      properties:
        serverId:
          description: The target server's short identifier from the panel.
          type: string
        signal:
          description: The power action to send.
          type: string
          enum: [start, stop, restart]

    PterodactylPowerResult:
      type: object
      required: [ok, demo]
      properties:
        ok:
          description: True when the signal was accepted.
          type: boolean
        demo:
          description: >-
            True when no Pterodactyl connection is configured — the request was
            acknowledged but nothing was sent (the tile is showing sample data).
          type: boolean

    TailscaleData:
      type: object
      required: [tailnet, deviceCount, onlineCount, offlineCount, exitNodeCount, expiringSoonCount, devices]
      properties:
        tailnet:
          description: The tailnet name the devices belong to.
          type: string
        deviceCount:
          description: Total number of devices in the tailnet.
          type: integer
        onlineCount:
          description: Number of devices currently online.
          type: integer
        offlineCount:
          description: Number of devices currently offline.
          type: integer
        exitNodeCount:
          description: Number of online devices offering an approved exit node.
          type: integer
        expiringSoonCount:
          description: >-
            Number of devices whose node key is expiring soon (within the warning
            window) or has already lapsed.
          type: integer
        devices:
          type: array
          items:
            $ref: "#/components/schemas/TailscaleDevice"

    TailscaleDevice:
      type: object
      required: [id, name, os, online, exitNode, keyExpiryDisabled, keyExpiringSoon]
      properties:
        id:
          type: string
        name:
          description: The device's machine/host name.
          type: string
        os:
          description: The device's operating system (e.g. linux, macOS, iOS).
          type: string
        online:
          description: >-
            Whether the device is currently online, derived from how recently it
            was last seen.
          type: boolean
        lastSeen:
          description: ISO timestamp of when the device was last seen, when known.
          type: ["string", "null"]
        exitNode:
          description: >-
            Whether the device offers an approved exit node (advertises and is
            allowed to route the default 0.0.0.0/0 route).
          type: boolean
        addresses:
          description: >-
            The device's tailnet IP addresses (e.g. the 100.x.y.z CGNAT
            address and an IPv6 address), in the order Tailscale reports them.
          type: array
          items:
            type: string
        expires:
          description: >-
            ISO timestamp of when the device's node key expires, or null when key
            expiry is disabled or no expiry is set.
          type: ["string", "null"]
        keyExpiryDisabled:
          description: >-
            Whether key expiry has been disabled for this device (its node key
            never expires).
          type: boolean
        keyExpiringSoon:
          description: >-
            Whether the device's node key is expiring within the warning window
            (or has already lapsed). Always false when key expiry is disabled.
          type: boolean

    ErsatzTvData:
      type: object
      required: [reachable, channels]
      properties:
        reachable:
          description: >-
            Whether the ErsatzTV server is up and reachable. Always true in a
            200 response (a configured-but-unreachable server returns 502); the
            field lets the tile render the health metric uniformly.
          type: boolean
        activeStreams:
          description: >-
            Number of currently active streaming sessions, taken from ErsatzTV's
            /api/sessions endpoint (one entry per active transcode session).
            Null when that endpoint is unavailable (e.g. an older instance or a
            network error), in which case the tile omits the metric rather than
            failing.
          type: ["integer", "null"]
        channels:
          description: Channels and what each is currently airing (from the EPG).
          type: array
          items:
            $ref: "#/components/schemas/ErsatzTvChannel"

    ErsatzTvChannel:
      type: object
      required: [number, name, nowPlaying]
      properties:
        number:
          description: The channel number (e.g. "1", "2.1").
          type: string
        name:
          description: The channel's display name.
          type: string
        nowPlaying:
          description: >-
            Title of the programme currently airing on the channel (start ≤ now
            < stop in the EPG). Null when nothing is currently scheduled.
          type: ["string", "null"]
        upNextTitle:
          description: >-
            Title of the next upcoming programme on the channel (the future
            programme with the earliest start time in the EPG). Null when
            nothing further is scheduled.
          type: ["string", "null"]
        upNextStart:
          description: >-
            ISO-8601 start time of the up-next programme. Null when
            upNextTitle is null.
          type: ["string", "null"]
          format: date-time

    PhotoAlbum:
      type: object
      required: [id, title]
      properties:
        id:
          description: Source-side album identifier.
          type: string
        title:
          description: The album's display name.
          type: string
        count:
          description: Number of items in the album when the source reports it.
          type: ["integer", "null"]

    PhotoAlbumsData:
      type: object
      required: [albums]
      properties:
        sample:
          description: >-
            True when the source is unconfigured and the albums are
            representative samples rather than real data.
          type: ["boolean", "null"]
        albums:
          type: array
          items:
            $ref: "#/components/schemas/PhotoAlbum"

    PhotoItem:
      type: object
      required: [id, url]
      properties:
        id:
          description: Source-side photo identifier.
          type: string
        url:
          description: >-
            URL the tile loads the image from. For server-backed sources this
            is an authenticated API proxy path (fetched with the bearer token
            and rendered via an object URL), never a raw upstream URL.
          type: string

    PhotosData:
      type: object
      required: [photos]
      properties:
        sample:
          description: >-
            True when the source is unconfigured; photos is empty and the tile
            falls back to its built-in demo slideshow.
          type: ["boolean", "null"]
        photos:
          type: array
          items:
            $ref: "#/components/schemas/PhotoItem"

    ErsatzGuideProgram:
      type: object
      required: [title, start, stop]
      properties:
        title:
          description: The programme's title.
          type: string
        start:
          description: ISO 8601 start time of the programme.
          type: string
        stop:
          description: ISO 8601 stop time of the programme.
          type: string

    ErsatzPlayableChannel:
      type: object
      required: [number, name]
      properties:
        number:
          description: The channel's number (ErsatzTV channel numbers can be fractional strings like "5.1").
          type: string
        name:
          description: The channel's display name.
          type: string
        nowPlaying:
          description: What's airing right now per the XMLTV guide. Null when unknown.
          type: ["string", "null"]
        nowPlayingStart:
          description: ISO 8601 start time of the current programme. Null when unknown.
          type: ["string", "null"]
        nowPlayingStop:
          description: ISO 8601 stop time of the current programme. Null when unknown.
          type: ["string", "null"]
        upNextTitle:
          description: The next programme's title per the XMLTV guide. Null when unknown.
          type: ["string", "null"]
        upNextStart:
          description: ISO 8601 start time of the next programme. Null when unknown.
          type: ["string", "null"]
        programs:
          description: >-
            The channel's schedule window for the guide grid: the current
            programme plus everything starting within the next few hours,
            sorted by start time. Empty when the guide has no data for the
            channel.
          type: array
          items:
            $ref: "#/components/schemas/ErsatzGuideProgram"
        streamUrl:
          description: >-
            Same-origin HLS playlist path (through the api-server's ErsatzTV
            stream proxy) the tile can play. The client appends its auth
            token as a query parameter. Null for sample channels.
          type: ["string", "null"]

    ErsatzChannelLineup:
      type: object
      required: [channels]
      properties:
        sample:
          description: >-
            True when ErsatzTV is not connected; channels is demo data and no
            stream URLs exist (the tile keeps its built-in demo video).
          type: ["boolean", "null"]
        channels:
          type: array
          items:
            $ref: "#/components/schemas/ErsatzPlayableChannel"

    VideoLibrary:
      type: object
      required: [id, title]
      properties:
        id:
          description: Server-side library/section identifier.
          type: string
        title:
          description: The library's display name.
          type: string
        kind:
          description: The library's content kind when the server reports it (e.g. movies, shows).
          type: ["string", "null"]

    VideoLibrariesData:
      type: object
      required: [libraries]
      properties:
        sample:
          description: >-
            True when the media server is not connected; libraries is empty
            and the tile stays on its built-in default video.
          type: ["boolean", "null"]
        libraries:
          type: array
          items:
            $ref: "#/components/schemas/VideoLibrary"

    VideoItem:
      type: object
      required: [id, title, streamUrl]
      properties:
        id:
          description: Server-side item identifier.
          type: string
        title:
          description: The video's display title.
          type: string
        streamUrl:
          description: >-
            A direct-play URL the browser's <video> element can load. Carries
            the media server's own auth token as a query parameter.
          type: string
        durationMs:
          description: Runtime in milliseconds when known.
          type: ["number", "null"]
        thumb:
          description: >-
            Fully-qualified, authenticated poster/thumbnail URL the browser can
            load directly. Only populated by the browse endpoint; null or
            absent when unavailable.
          type: ["string", "null"]

    VideoPlaylistData:
      type: object
      required: [videos]
      properties:
        sample:
          description: >-
            True when the media server is not connected; videos is empty and
            the tile plays its built-in default instead.
          type: ["boolean", "null"]
        videos:
          type: array
          items:
            $ref: "#/components/schemas/VideoItem"

    VideoContainer:
      type: object
      required: [id, kind, title]
      properties:
        id:
          description: >-
            Stable identifier (Plex ratingKey) used to drill into this
            container via the browse endpoint.
          type: string
        kind:
          description: What this container is, so the client knows how to expand it.
          type: string
          enum: [show, season]
        title:
          description: Display name of the show or season.
          type: string
        subtitle:
          description: Secondary line (episode/season counts, year). Null when none.
          type: ["string", "null"]
        thumb:
          description: >-
            Fully-qualified, authenticated poster/thumbnail URL the browser can
            load directly (Plex token appended). Null when unavailable.
          type: ["string", "null"]

    VideoBrowseResult:
      type: object
      required: [sample]
      properties:
        sample:
          description: >-
            True when the media server is not connected; listings are empty
            and the tile stays on its built-in default video.
          type: boolean
        containers:
          description: >-
            Drillable containers (shows or seasons). Absent when the request
            returned playable videos instead.
          type: array
          items:
            $ref: "#/components/schemas/VideoContainer"
        videos:
          description: >-
            Playable episodes with direct-play stream URLs. Absent when the
            request returned containers instead.
          type: array
          items:
            $ref: "#/components/schemas/VideoItem"
        nextOffset:
          description: >-
            When the level has more items than this page returned, the offset
            to pass to fetch the next page. Null/absent when the listing is
            complete.
          type: [integer, "null"]
        total:
          description: >-
            Total number of items in the level when the media server reports
            it. Null/absent when unknown.
          type: [integer, "null"]

    AudioTrack:
      type: object
      required: [id, title]
      properties:
        id:
          description: Stable identifier for the track within its source.
          type: string
        title:
          description: The track title.
          type: string
        artist:
          description: Track artist (Plex grandparentTitle). Null when unknown.
          type: ["string", "null"]
        album:
          description: Album the track belongs to (Plex parentTitle). Null when unknown.
          type: ["string", "null"]
        artistId:
          description: >-
            Source-side identifier of the track's artist (Plex
            grandparentRatingKey, Subsonic artistId, Jellyfin ArtistItems[0].Id),
            usable as a browse-endpoint container id. Null/absent when the
            source can't resolve it.
          type: ["string", "null"]
        albumId:
          description: >-
            Source-side identifier of the track's album (Plex parentRatingKey,
            Subsonic albumId, Jellyfin AlbumId), usable as a browse-endpoint
            container id. Null/absent when the source can't resolve it.
          type: ["string", "null"]
        artwork:
          description: >-
            Fully-qualified, authenticated album-art URL the browser can load
            directly (Plex token appended). Null when the source has no artwork.
          type: ["string", "null"]
        durationMs:
          description: Track length in milliseconds. Null when the source omits it.
          type: ["number", "null"]
        progressMs:
          description: >-
            Playback offset in milliseconds for the source's current session
            (Plex viewOffset). Only set on the now-playing track of an active
            remote session; null otherwise.
          type: ["number", "null"]
        state:
          description: >-
            Remote playback state reported by the source for an active session:
            "playing", "paused", or "stopped". Null when there is no active
            session (the track is a queue/last-played entry, not live).
          type: ["string", "null"]
        streamUrl:
          description: >-
            Fully-qualified, authenticated audio stream URL an HTML audio element
            can play directly (Plex part key + token). Null when the source does
            not expose an in-browser-playable stream (remote-control-only).
          type: ["string", "null"]
        liked:
          description: >-
            Whether the track is currently marked as a favorite on the source
            (Plex user rating, Navidrome/Subsonic star, Jellyfin favorite). True
            when favorited, false when not. Null when the source doesn't report
            it or favoriting isn't supported (e.g. Spotify, demo content).
          type: ["boolean", "null"]

    AudioContainer:
      type: object
      required: [id, kind, title]
      properties:
        id:
          description: >-
            Stable identifier for the container within its source, used to drill
            into it via the browse endpoint.
          type: string
        kind:
          description: What this container is, so the client knows how to expand it.
          type: string
          enum: [artist, album, playlist]
        title:
          description: Display name of the artist, album, or playlist.
          type: string
        subtitle:
          description: >-
            Secondary line (album artist, track count, etc.). Null when none.
          type: ["string", "null"]
        artwork:
          description: >-
            Fully-qualified, authenticated cover-art URL the browser can load
            directly. Null when the source has no artwork.
          type: ["string", "null"]

    AudioBrowseResult:
      type: object
      required: [source, sample]
      properties:
        source:
          description: The music source backing this response ("plex" or "subsonic").
          type: string
        sample:
          description: >-
            True when the results are built-in demo content (the source is not
            configured); selecting them yields no real playback.
          type: boolean
        artists:
          description: >-
            Matching/listed artists (search results or a browse listing). Absent
            when not applicable to the request.
          type: array
          items:
            $ref: "#/components/schemas/AudioContainer"
        albums:
          description: >-
            Matching/listed albums (search results, a browse listing, or an
            artist's albums). Absent when not applicable to the request.
          type: array
          items:
            $ref: "#/components/schemas/AudioContainer"
        playlists:
          description: >-
            The source's playlists. Absent when not applicable to the request.
          type: array
          items:
            $ref: "#/components/schemas/AudioContainer"
        tracks:
          description: >-
            Playable tracks (search results, an album's tracks, or a playlist's
            tracks). Each carries a browser-playable streamUrl for the shared
            engine. Absent when not applicable to the request.
          type: array
          items:
            $ref: "#/components/schemas/AudioTrack"

    AudioPlayerData:
      type: object
      required: [source, sample, nowPlaying, queue]
      properties:
        source:
          description: The music source backing this response (e.g. "plex").
          type: string
        sample:
          description: >-
            True when the track(s) are built-in demo content (the source is not
            configured), so the tile can label playback as not-live and disable
            in-browser streaming.
          type: boolean
        nowPlaying:
          description: >-
            The source's current or last music track. For Plex this is the
            active music session when one exists, otherwise the most recently
            added/played track. Null when nothing is available.
          oneOf:
            - $ref: "#/components/schemas/AudioTrack"
            - type: "null"
        queue:
          description: >-
            Ordered list of browser-playable tracks the shared player can step
            through (skip next/previous). For Plex this is the now-playing
            track's album, or recent tracks when no session is active.
          type: array
          items:
            $ref: "#/components/schemas/AudioTrack"
        auth:
          description: >-
            Authorization state for sources that require OAuth (Spotify):
            "connected" when a valid linked account exists, "needed" when the
            user must link their account in Settings first. Null for sources
            that need no per-user OAuth (e.g. Plex).
          type: ["string", "null"]
          enum: ["connected", "needed", null]
        premium:
          description: >-
            Whether the linked account supports in-browser playback via the
            Spotify Web Playback SDK (Premium). True enables in-dashboard
            streaming; false degrades to remote control of an external device.
            Null when not applicable (non-OAuth sources or not connected).
          type: ["boolean", "null"]
        canControl:
          description: >-
            True when there is an active remote device the tile can drive
            (play/pause/skip). False when nothing is controllable right now
            (no active Spotify device). Null when not applicable.
          type: ["boolean", "null"]
        device:
          description: >-
            The source's currently active playback device, when one exists
            (Spotify). Null when there is no active device or not applicable.
          oneOf:
            - $ref: "#/components/schemas/AudioDevice"
            - type: "null"

    AudioDevice:
      type: object
      required: [id, name, isActive]
      properties:
        id:
          description: Source-specific device identifier.
          type: ["string", "null"]
        name:
          description: Human-readable device name (e.g. "Living Room", "Web Player").
          type: string
        isActive:
          description: Whether this device is the one currently playing.
          type: boolean
        volumePercent:
          description: Device output volume 0–100, when the source reports it.
          type: ["number", "null"]

    NewsData:
      type: object
      required: [feedTitle, items]
      properties:
        feedTitle:
          description: >-
            The feed's own title (e.g. "BBC News"), used as a source label on
            the tile. Null when the feed does not provide one.
          type: ["string", "null"]
        items:
          description: Recent headlines parsed from the feed, newest first.
          type: array
          items:
            $ref: "#/components/schemas/NewsItem"

    NewsItem:
      type: object
      required: [title, link]
      properties:
        title:
          description: The headline text.
          type: string
        link:
          description: >-
            URL of the full article. Null when the feed entry has no link, in
            which case the tile renders the headline as plain text.
          type: ["string", "null"]
        source:
          description: >-
            Per-item source/feed name when present (some aggregated feeds tag
            each entry). Null when not provided; the tile falls back to the
            feed title.
          type: ["string", "null"]
        published:
          description: >-
            ISO timestamp of when the item was published, when the feed provides
            one. Null otherwise.
          type: ["string", "null"]
