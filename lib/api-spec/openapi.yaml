openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Tachboard API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: tiles
    description: Dashboard tiles
  - name: uploads
    description: Image uploads
  - name: widgets
    description: Live data widgets
  - name: connections
    description: Service connection settings
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /version:
    get:
      operationId: getVersion
      tags: [health]
      summary: Current build version and update availability
      responses:
        "200":
          description: Version info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionInfo"

  /auth/register:
    post:
      operationId: register
      tags: [auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "201":
          description: Registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Bad request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in and receive a JWT
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuthCredentials"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current user info
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /tiles:
    get:
      operationId: getTiles
      tags: [tiles]
      summary: List tiles for the authenticated user (optionally scoped to a page)
      security:
        - bearerAuth: []
      parameters:
        - name: pageId
          in: query
          required: false
          description: >-
            When provided, return only the tiles belonging to this page.
            Omitting it returns every tile the user owns.
          schema:
            type: integer
        - name: deviceModeId
          in: query
          required: false
          description: >-
            When provided together with pageId, return only the tiles that
            belong to this device mode's layout. Omitting it returns the page's
            tiles across all modes (legacy behavior).
          schema:
            type: integer
        - name: variant
          in: query
          required: false
          description: >-
            Adaptive layout variant key (e.g. "fhd-landscape") to scope the
            result to, used with deviceModeId. Omitting it selects the base
            layout (variant null) used by auto/fixed pages.
          schema:
            type: string
      responses:
        "200":
          description: Tile list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tile"
    post:
      operationId: createTile
      tags: [tiles]
      summary: Create a new tile
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TileInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tile"

  /tiles/{id}:
    get:
      operationId: getTile
      tags: [tiles]
      summary: Get a single tile
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Tile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tile"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateTile
      tags: [tiles]
      summary: Update a tile's config or position
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TileUpdate"
      responses:
        "200":
          description: Updated tile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Tile"
    delete:
      operationId: deleteTile
      tags: [tiles]
      summary: Delete a tile
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /tiles/layout:
    put:
      operationId: saveLayout
      tags: [tiles]
      summary: Bulk-save tile layout (positions and sizes)
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LayoutUpdate"
      responses:
        "200":
          description: Updated tiles
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Tile"

  /device-modes:
    get:
      operationId: getDeviceModes
      tags: [device-modes]
      summary: List the authenticated user's device modes
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Device mode list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DeviceMode"
    post:
      operationId: createDeviceMode
      tags: [device-modes]
      summary: Create a new device mode
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceModeInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceMode"
        "400":
          description: Missing or invalid name
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /device-modes/{id}:
    put:
      operationId: updateDeviceMode
      tags: [device-modes]
      summary: Rename a device mode
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceModeInput"
      responses:
        "200":
          description: Updated device mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceMode"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deleteDeviceMode
      tags: [device-modes]
      summary: Delete a device mode and every tile in it
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deleted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SuccessResponse"
        "400":
          description: Cannot delete the last remaining device mode
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pages:
    get:
      operationId: getPages
      tags: [pages]
      summary: List the authenticated user's dashboard pages
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Page list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Page"
    post:
      operationId: createPage
      tags: [pages]
      summary: Create a new dashboard page
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PageInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page"

  /pages/reorder:
    put:
      operationId: reorderPages
      tags: [pages]
      summary: Persist a new page display order
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PageReorder"
      responses:
        "200":
          description: Reordered page list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Page"

  /pages/{id}:
    put:
      operationId: updatePage
      tags: [pages]
      summary: Rename a dashboard page
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PageInput"
      responses:
        "200":
          description: Updated page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Page"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    delete:
      operationId: deletePage
      tags: [pages]
      summary: Delete a dashboard page and its tiles
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "400":
          description: Cannot delete the last remaining page
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pages/export:
    get:
      operationId: exportAllPages
      tags: [pages]
      summary: Export all of the user's pages as a downloadable envelope
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Export envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageExport"

  /pages/{id}/export:
    get:
      operationId: exportPage
      tags: [pages]
      summary: Export a single page as a downloadable envelope
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Export envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PageExport"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pages/import:
    post:
      operationId: importPages
      tags: [pages]
      summary: Recreate one or more pages from a previously exported envelope
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PageExport"
      responses:
        "201":
          description: The newly created pages, in display order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Page"
        "400":
          description: Malformed or incompatible export file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /profile/export:
    get:
      operationId: exportProfile
      tags: [profile]
      summary: Export the user's entire profile as a downloadable envelope
      security:
        - bearerAuth: []
      parameters:
        - name: includeConnections
          in: query
          required: false
          description: >-
            When true, include the user's saved service connection credentials
            (URLs, API keys, usernames, passwords, tokens) in READABLE form.
            Off by default.
          schema:
            type: boolean
      responses:
        "200":
          description: Profile export envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileExport"

  /profile/import:
    post:
      operationId: importProfile
      tags: [profile]
      summary: Recreate a full profile from a previously exported envelope
      description: |
        Accepts only the plain "tachboard-profile" envelope. Passphrase-encrypted
        exports (format "tachboard-profile-encrypted") are decrypted client-side
        in the Settings page before being posted here; sending one directly
        returns a 400 explaining that.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileImportBody"
      responses:
        "200":
          description: Counts of what was imported
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProfileImportResult"
        "400":
          description: Malformed or incompatible export file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pages/{id}/layouts:
    get:
      operationId: getPageLayouts
      tags: [pages]
      summary: List the non-empty (device mode, variant) layouts on a page
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Layout scopes with tile counts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PageLayoutInfo"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /pages/{id}/copy-layout:
    post:
      operationId: copyPageLayout
      tags: [pages]
      summary: Copy all tiles from one layout scope of a page into another
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CopyLayoutBody"
      responses:
        "201":
          description: Number of tiles copied into the target layout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CopyLayoutResult"
        "400":
          description: Target layout not empty (without replace), or source equals target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Page or device mode not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /uploads:
    get:
      operationId: listUploads
      tags: [uploads]
      summary: List the authenticated user's uploaded images
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Uploaded image list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UploadedFile"

  /uploads/usage:
    get:
      operationId: getUploadUsage
      tags: [uploads]
      summary: Get total upload storage usage and the configured cap
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Upload storage usage
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UploadUsage"

  /uploads/{id}:
    delete:
      operationId: deleteUpload
      tags: [uploads]
      summary: Delete an uploaded image from the library
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /widgets/truenas:
    get:
      operationId: getTruenasMetrics
      tags: [widgets]
      summary: Get TrueNAS system metrics (CPU, RAM, ZFS pools)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: TrueNAS metrics
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TruenasMetrics"

  /widgets/truenas/diagnostics:
    get:
      operationId: getTruenasDiagnostics
      tags: [widgets]
      summary: >-
        Run a read-only TrueNAS reporting diagnostic against the live NAS,
        capturing the exact requests sent and the raw responses (including the
        upstream error body). Used to discover why reporting/get_data is
        rejected on a given SCALE version. The API key is never echoed.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Diagnostic probe results
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "409":
          description: TrueNAS is not configured
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /widgets/media:
    get:
      operationId: getMediaRecent
      tags: [widgets]
      summary: Get recently added media from Plex or Jellyfin
      security:
        - bearerAuth: []
      parameters:
        - name: server
          in: query
          required: false
          description: >-
            Which media server the tile is backed by. "plex" resolves the saved
            Plex connection; "jellyfin" resolves the saved Jellyfin connection.
            Defaults to "plex" when omitted.
          schema:
            type: string
            enum: [plex, jellyfin]
      responses:
        "200":
          description: Recent media items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MediaItem"

  /widgets/media/continue:
    get:
      operationId: getMediaContinue
      tags: [widgets]
      summary: Get in-progress / on-deck media to continue watching from Plex or Jellyfin
      security:
        - bearerAuth: []
      parameters:
        - name: server
          in: query
          required: false
          description: >-
            Which media server the tile is backed by. "plex" resolves the saved
            Plex connection (On Deck); "jellyfin" resolves the saved Jellyfin
            connection (Resume items). Defaults to "plex" when omitted.
          schema:
            type: string
            enum: [plex, jellyfin]
      responses:
        "200":
          description: Continue watching items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ContinueWatchingItem"

  /widgets/sonarr:
    get:
      operationId: getSonarrQueue
      tags: [widgets]
      summary: Get upcoming shows or active download queue from Sonarr
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Sonarr queue/calendar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SonarrData"

  /widgets/radarr:
    get:
      operationId: getRadarrQueue
      tags: [widgets]
      summary: Get upcoming movie releases or active download queue from Radarr
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Radarr queue/calendar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RadarrData"

  /widgets/lidarr:
    get:
      operationId: getLidarrQueue
      tags: [widgets]
      summary: Get upcoming album releases or active download queue from Lidarr
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Lidarr queue/calendar
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LidarrData"

  /widgets/qbittorrent:
    get:
      operationId: getQbittorrentStatus
      tags: [widgets]
      summary: Get active torrents and global transfer stats from qBittorrent
      security:
        - bearerAuth: []
      responses:
        "200":
          description: qBittorrent torrents/transfer stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QbittorrentData"

  /widgets/pihole:
    get:
      operationId: getPiholeMetrics
      tags: [widgets]
      summary: Get DNS query/ad-block summary stats from Pi-hole
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Pi-hole DNS stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PiholeData"

  /widgets/nginx-proxy-manager:
    get:
      operationId: getNginxProxyManagerData
      tags: [widgets]
      summary: Get proxy host, dead host, and SSL certificate summary from Nginx Proxy Manager
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Nginx Proxy Manager summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NginxProxyManagerData"

  /widgets/prowlarr:
    get:
      operationId: getProwlarrWidget
      tags: [widgets]
      summary: Get indexer status, recent grab count, and health warnings from Prowlarr
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Prowlarr indexer status summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProwlarrData"

  /widgets/pterodactyl:
    get:
      operationId: getPterodactylWidget
      tags: [widgets]
      summary: Get game server list with per-server state and live resource usage from the Pterodactyl panel
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Pterodactyl game server status summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PterodactylData"

  /widgets/pterodactyl/power:
    post:
      operationId: sendPterodactylPower
      tags: [widgets]
      summary: Send a power signal (start/stop/restart) to one game server on the Pterodactyl panel
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PterodactylPowerRequest"
      responses:
        "200":
          description: The power signal was accepted (or acknowledged as a demo no-op)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PterodactylPowerResult"
        "400":
          description: Invalid server id or power signal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The Pterodactyl panel rejected the request or could not be reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /widgets/pterodactyl/diagnostics:
    get:
      operationId: getPterodactylDiagnostics
      tags: [widgets]
      summary: >-
        Run a read-only diagnostic of the player-count pipeline against the
        live panel: per server, the metadata hints, the guessed game type,
        the candidate query host/port targets, and the live game-query
        outcome or error. Used to pinpoint why a player count is missing.
        The API key is never echoed.
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Diagnostic results per server
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
        "409":
          description: Pterodactyl is not configured
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true

  /widgets/tailscale:
    get:
      operationId: getTailscaleStatus
      tags: [widgets]
      summary: Get tailnet device status (online/offline counts and per-device list) from Tailscale
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Tailscale tailnet status summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TailscaleData"

  /widgets/ersatztv:
    get:
      operationId: getErsatzTvWidget
      tags: [widgets]
      summary: Get live status (reachability, active streams, and per-channel now playing) from ErsatzTV
      security:
        - bearerAuth: []
      responses:
        "200":
          description: ErsatzTV live status summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErsatzTvData"

  /widgets/ersatztv/channels:
    get:
      operationId: getErsatzChannels
      tags: [widgets]
      summary: List ErsatzTV's tunable channel lineup for the Video Player tile
      security:
        - bearerAuth: []
      responses:
        "200":
          description: >-
            The channel lineup (number, name, now airing, and a same-origin
            HLS stream URL per channel), or sample:true with demo channels
            when ErsatzTV is not connected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErsatzChannelLineup"
        "502":
          description: The configured ErsatzTV server could not be reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /widgets/photos/albums:
    get:
      operationId: getPhotoAlbums
      tags: [widgets]
      summary: List albums from a connected photo source (Google Photos or Immich)
      security:
        - bearerAuth: []
      parameters:
        - name: source
          in: query
          required: true
          description: >-
            Which photo source to list albums from. "google" uses the linked
            Google account (Photos scope); "immich" the saved Immich server
            connection.
          schema:
            type: string
            enum: [google, immich]
      responses:
        "200":
          description: The source's albums (or sample albums when unconfigured)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotoAlbumsData"
        "502":
          description: The configured photo source could not be reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /widgets/photos:
    get:
      operationId: getPhotosWidget
      tags: [widgets]
      summary: Get a normalized photo list for the Picture Frame tile from a server-backed source
      security:
        - bearerAuth: []
      parameters:
        - name: source
          in: query
          required: true
          description: >-
            Which photo source to read. "google" lists a Google Photos album
            (photo URLs are server-side proxy paths because Google baseUrls
            expire); "immich" lists an Immich album (proxy paths carry the API
            key server-side).
          schema:
            type: string
            enum: [google, immich]
        - name: albumId
          in: query
          required: false
          description: The album to list. Required once the source is configured.
          schema:
            type: string
      responses:
        "200":
          description: >-
            The album's photos, or sample:true with an empty list when the
            source is unconfigured (the tile then shows built-in demo photos).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PhotosData"
        "502":
          description: The configured photo source could not be reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /widgets/videoplayer/libraries:
    get:
      operationId: getVideoLibraries
      tags: [widgets]
      summary: List video libraries from a connected media server (Plex or Jellyfin)
      security:
        - bearerAuth: []
      parameters:
        - name: server
          in: query
          required: true
          description: >-
            Which media server to list video libraries from. "plex" uses the
            saved Plex connection; "jellyfin" the saved Jellyfin connection.
          schema:
            type: string
            enum: [plex, jellyfin]
      responses:
        "200":
          description: >-
            The server's movie/TV libraries, or sample:true with an empty list
            when the server is not connected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoLibrariesData"
        "502":
          description: The configured media server could not be reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /widgets/videoplayer:
    get:
      operationId: getVideoPlaylist
      tags: [widgets]
      summary: Get a normalized, direct-playable video playlist for the Video Player tile
      security:
        - bearerAuth: []
      parameters:
        - name: server
          in: query
          required: true
          description: Which media server backs the playlist.
          schema:
            type: string
            enum: [plex, jellyfin]
        - name: libraryId
          in: query
          required: false
          description: The library to list. Required once the server is connected.
          schema:
            type: string
      responses:
        "200":
          description: >-
            The library's videos with direct-play stream URLs, or sample:true
            with an empty list when the server is not connected (the tile then
            plays its built-in default).
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoPlaylistData"
        "502":
          description: The configured media server could not be reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /widgets/videoplayer/browse:
    get:
      operationId: browseVideoLibrary
      tags: [widgets]
      summary: Drill into a Plex or Jellyfin video library (shows → seasons → episodes)
      security:
        - bearerAuth: []
      parameters:
        - name: server
          in: query
          required: true
          description: >-
            Which media server to browse. "plex" and "jellyfin" support video
            drill-down; other sources use the flat playlist endpoint.
          schema:
            type: string
            enum: [plex, jellyfin]
        - name: kind
          in: query
          required: true
          description: >-
            What to list. "shows" lists a TV library's shows (requires
            libraryId); "movies" lists a movie library's playable movies with
            posters (requires libraryId); "seasons" lists a show's seasons
            (requires id); "episodes" lists a season's playable episodes
            (requires id); "show_episodes" lists every playable episode of a
            show in order (requires id), used to queue a whole show;
            "recently_added" and "continue_watching" list the server's
            Recently Added and Continue Watching (On Deck) items (Plex only,
            no libraryId/id).
          schema:
            type: string
            enum: [shows, movies, seasons, episodes, show_episodes, recently_added, continue_watching]
        - name: libraryId
          in: query
          required: false
          description: The library section to list shows from. Required for kind=shows.
          schema:
            type: string
        - name: id
          in: query
          required: false
          description: >-
            The container id (show or season ratingKey) to drill into.
            Required for kind=seasons, kind=episodes, and kind=show_episodes.
          schema:
            type: string
        - name: offset
          in: query
          required: false
          description: >-
            Zero-based index of the first item to return within the level.
            Each response returns at most one page of items; when more remain,
            nextOffset carries the offset to request the following page.
            Defaults to 0.
          schema:
            type: integer
            minimum: 0
      responses:
        "200":
          description: >-
            The requested listing: containers (shows or seasons) or playable
            videos (episodes), or sample:true when Plex is not connected.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VideoBrowseResult"
        "400":
          description: Unknown kind or a required libraryId/id was missing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The configured media server could not be reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /widgets/audioplayer:
    get:
      operationId: getAudioPlayerNowPlaying
      tags: [widgets]
      summary: Get the current/last music track and a playable queue for the Audio Player tile
      security:
        - bearerAuth: []
      parameters:
        - name: source
          in: query
          required: false
          description: >-
            Which music source backs the tile. "plex" resolves the saved Plex
            connection, "jellyfin" the saved Jellyfin connection, and "subsonic"
            the saved Navidrome / Subsonic connection; each returns its
            current/last music session plus a browser-playable queue. "spotify"
            uses the linked Spotify account. Defaults to "plex" when omitted.
          schema:
            type: string
            enum: [plex, spotify, jellyfin, subsonic]
      responses:
        "200":
          description: Now-playing track and queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioPlayerData"
        "502":
          description: The configured music source could not be reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /widgets/audioplayer/search:
    get:
      operationId: searchAudioLibrary
      tags: [widgets]
      summary: Search a music source's library for artists, albums, and tracks
      security:
        - bearerAuth: []
      parameters:
        - name: source
          in: query
          required: false
          description: >-
            Which music source to search. "plex" resolves the saved Plex
            connection; "subsonic" the saved Navidrome / Subsonic connection;
            "jellyfin" the saved Jellyfin connection. Defaults to "plex" when
            omitted.
          schema:
            type: string
            enum: [plex, subsonic, jellyfin]
        - name: query
          in: query
          required: true
          description: The text to match against artist, album, and track names.
          schema:
            type: string
      responses:
        "200":
          description: Search results grouped into artists, albums, and tracks
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioBrowseResult"
        "502":
          description: The configured music source could not be reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /widgets/audioplayer/browse:
    get:
      operationId: browseAudioLibrary
      tags: [widgets]
      summary: Browse a music source's library and playlists (with drill-down)
      security:
        - bearerAuth: []
      parameters:
        - name: source
          in: query
          required: false
          description: >-
            Which music source to browse. "plex", "subsonic", or "jellyfin".
            Defaults to "plex" when omitted.
          schema:
            type: string
            enum: [plex, subsonic, jellyfin]
        - name: kind
          in: query
          required: true
          description: >-
            What to list. "recent" = recently added albums, "albums" = all
            albums, "artists" = all artists, "playlists" = all playlists,
            "random" = a flat list of ~20 random playable tracks. The
            drill-down kinds require an id: "artist" returns that artist's
            albums, "album" returns that album's tracks, "playlist" returns
            that playlist's tracks.
          schema:
            type: string
            enum: [recent, albums, artists, artist, album, playlists, playlist, random]
        - name: id
          in: query
          required: false
          description: >-
            The container id to drill into. Required for kind=artist,
            kind=album, and kind=playlist; ignored for the top-level listings.
          schema:
            type: string
      responses:
        "200":
          description: The requested browse listing
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioBrowseResult"
        "400":
          description: A drill-down kind was requested without the required id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The configured music source could not be reached
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /widgets/subsonic/scrobble:
    post:
      operationId: scrobbleSubsonic
      tags: [widgets]
      summary: >-
        Report a Subsonic/Navidrome play to the server so the dashboard appears
        as a real session (now-playing + play counts) to other clients
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SubsonicScrobbleInput"
      responses:
        "200":
          description: The scrobble was accepted by the server
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SubsonicScrobbleResult"
        "400":
          description: Missing or invalid track id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No Subsonic / Navidrome connection is configured
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The Subsonic server could not be reached or rejected the scrobble
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /widgets/audioplayer/favorite:
    post:
      operationId: setAudioFavorite
      tags: [widgets]
      summary: >-
        Mark the currently playing track as a favorite (or remove it) on the
        connected music source
      description: >-
        Toggles a track's favorite/like state on the source and returns the new
        state. Dispatches by "source": Plex sets the track's user rating,
        Navidrome/Subsonic stars/unstars it, and Jellyfin adds/removes it from
        favorites. Spotify is not yet supported.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AudioFavoriteInput"
      responses:
        "200":
          description: The new favorite state after the toggle was applied
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AudioFavoriteResult"
        "400":
          description: Missing/invalid track id or an unsupported source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: No connection is configured for the requested source
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The music source could not be reached or rejected the change
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /widgets/news:
    get:
      operationId: getNewsWidget
      tags: [widgets]
      summary: Fetch and parse recent headlines from an RSS/Atom feed URL
      security:
        - bearerAuth: []
      parameters:
        - name: url
          in: query
          required: false
          description: >-
            The RSS or Atom feed URL to fetch. When omitted, representative demo
            headlines are returned so an unconfigured tile still renders.
          schema:
            type: string
        - name: limit
          in: query
          required: false
          description: Maximum number of headlines to return (clamped server-side).
          schema:
            type: integer
      responses:
        "200":
          description: Parsed feed headlines
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NewsData"
        "502":
          description: The configured feed could not be fetched or parsed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /widgets/email/inbox:
    get:
      operationId: getEmailInbox
      tags: [widgets]
      summary: Aggregated recent messages across the configured mail accounts
      security:
        - bearerAuth: []
      parameters:
        - name: accounts
          in: query
          required: false
          description: >-
            Comma-separated account keys to include ("gmail" or an IMAP account
            id). When omitted, all configured accounts are aggregated. When no
            accounts are configured at all, demo messages are returned so an
            unconfigured tile still renders.
          schema:
            type: string
        - name: max
          in: query
          required: false
          description: Maximum number of messages to return (clamped server-side).
          schema:
            type: integer
        - name: unreadOnly
          in: query
          required: false
          description: When "true", only unread messages are returned.
          schema:
            type: string
        - name: fresh
          in: query
          required: false
          description: >-
            When "true", bypasses the short server-side fetch cache and pulls
            straight from the mail providers (used by the tile's manual
            refresh). Background polling should omit this so the cache keeps
            protecting provider rate limits.
          schema:
            type: string
      responses:
        "200":
          description: Recent messages, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailInboxData"
        "502":
          description: Every configured mail account failed to respond
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /widgets/email/message:
    get:
      operationId: getEmailMessageBody
      tags: [widgets]
      summary: Fetch one email message's plain-text body on demand
      description: >-
        Fetches the full body of the message identified by its EmailMessage id,
        sanitized to plain text (HTML parts are stripped, never rendered).
        Gmail messages are pulled with format=full preferring the text/plain
        part; IMAP messages fetch the text body part over IMAP. Demo messages
        are rejected.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: query
          required: true
          description: The EmailMessage id whose body should be fetched.
          schema:
            type: string
      responses:
        "200":
          description: The message body (null when the message has no text part)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailMessageBodyData"
        "400":
          description: Missing/malformed message id, or a demo message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The message references an account that no longer exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The mail provider rejected or failed the fetch
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /widgets/email/archive:
    post:
      operationId: archiveEmailMessage
      tags: [widgets]
      summary: Archive one email message
      description: >-
        Archives the message identified by its EmailMessage id. Gmail messages
        have the INBOX label removed (requires the account to be linked with
        modify access); IMAP messages are moved to the server's Archive
        mailbox. Demo messages are rejected.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailArchiveRequest"
      responses:
        "200":
          description: The message was archived
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailArchiveResponse"
        "400":
          description: Missing/malformed message id, or a demo message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: >-
            The Google account was linked with read-only access and must be
            re-linked before archiving works
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The message references an account that no longer exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The mail provider rejected or failed the archive request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /widgets/email/mark-read:
    post:
      operationId: markEmailMessageRead
      tags: [widgets]
      summary: Mark one email message as read
      description: >-
        Marks the message identified by its EmailMessage id as read. Gmail
        messages have the UNREAD label removed (requires the account to be
        linked with modify access); IMAP messages get the \Seen flag added and
        stay in the inbox. Demo messages are rejected.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmailMarkReadRequest"
      responses:
        "200":
          description: The message was marked read
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmailMarkReadResponse"
        "400":
          description: Missing/malformed message id, or a demo message
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: >-
            The Google account was linked with read-only access and must be
            re-linked before marking messages read works
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: The message references an account that no longer exists
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "502":
          description: The mail provider rejected or failed the mark-read request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /widgets/calendar/events:
    get:
      operationId: getCalendarEvents
      tags: [widgets]
      summary: Aggregated upcoming events across the configured calendar accounts
      security:
        - bearerAuth: []
      parameters:
        - name: accounts
          in: query
          required: false
          description: >-
            Comma-separated account keys to include ("google" or a CalDAV
            account id). When omitted, all configured accounts are aggregated.
            When no accounts are configured at all, demo events are returned so
            an unconfigured tile still renders.
          schema:
            type: string
        - name: days
          in: query
          required: false
          description: How many days ahead to look (clamped server-side).
          schema:
            type: integer
        - name: max
          in: query
          required: false
          description: Maximum number of events to return (clamped server-side).
          schema:
            type: integer
        - name: fresh
          in: query
          required: false
          description: >-
            When "true", bypasses the short server-side fetch cache and pulls
            straight from the calendar providers (used by the tile's manual
            refresh). Background polling should omit this so the cache keeps
            protecting provider rate limits.
          schema:
            type: string
      responses:
        "200":
          description: Upcoming events, soonest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CalendarEventsData"
        "502":
          description: Every configured calendar account failed to respond
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /widgets/stocks:
    get:
      operationId: getStocksWidget
      tags: [widgets]
      summary: Get current price and daily change for a set of stock symbols
      security:
        - bearerAuth: []
      parameters:
        - name: symbols
          in: query
