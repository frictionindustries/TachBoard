{% set tpl = ix_lib.base.render.Render(values) %}

{% set c1 = tpl.add_container(values.consts.tachboard_container_name | default("tachboard"), "image") %}

{% do c1.set_user(values.run_as.user | default(568), values.run_as.group | default(568)) %}
{% do c1.healthcheck.set_test("wget", {"port": 20028, "path": "/api/healthz"}) %}

{% do c1.environment.add_env("NODE_ENV", "production") %}
{% do c1.environment.add_env("PORT", 20028) %}
{% do c1.environment.add_env("DATA_DIR", "/data") %}
{% do c1.environment.add_user_envs(values.tachboard.additional_envs) %}

{% do c1.add_port(values.network.web_port, {"container_port": 20028}) %}

{% do c1.add_storage("/data", values.storage.data) %}
{% do tpl.funcs.disallow_empty(values.storage.data, "storage.data") %}

{% do tpl.portals.add(values.network.web_port) %}

{{ tpl.render() | tojson }}
