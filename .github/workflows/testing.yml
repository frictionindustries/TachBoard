name: Testing Docker image

on:
  push:
    branches: [testing]
  workflow_dispatch:

permissions:
  contents: read

# Serialize publication so overlapping runs cannot publish out of order.
concurrency:
  group: tachboard-testing-image
  cancel-in-progress: false

jobs:
  desktop-companion:
    name: Desktop companion adapters (${{ matrix.os }})
    if: github.ref == 'refs/heads/testing'
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Test companion protocol client and native process adapter
        run: python -m unittest discover -s packaging/desktop -p "test_*.py" -v
      - name: Upload source companion (no credentials or native installer)
        if: matrix.os == 'ubuntu-24.04'
        uses: actions/upload-artifact@v7
        with:
          name: desktop-companion-source-testing
          path: |
            packaging/desktop/companion.py
            packaging/desktop/requirements.txt
            packaging/desktop/README.md
          if-no-files-found: error

  tests:
    name: Unit tests (api-server)
    # Manual dispatch must explicitly select the testing branch.
    if: github.ref == 'refs/heads/testing'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run api-server test suite
        run: pnpm --filter @workspace/api-server test
      - name: Test Pi installer
        run: |
          python3 -m unittest discover -s packaging/pi -p 'test_*.py' -v
          node --test scripts/package-pi.test.mjs

  pi:
    name: Pi edition (ARM64)
    needs: [tests]
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build server
        env:
          APP_VERSION: testing-${{ github.sha }}
          APP_REPO: ${{ github.repository }}
        run: pnpm --filter @workspace/api-server run build
      - name: Build dashboard
        env:
          NODE_ENV: production
          BASE_PATH: /
          PORT: "20028"
        run: pnpm --filter @workspace/homelab-dashboard run build
      - name: Package ARM64 server
        run: node scripts/package-release.mjs --out release --no-archive
      - name: Smoke test ARM64 server
        run: node scripts/smoke-test-bundle.mjs release/tachboard-linux-arm64
      - name: Package Pi edition
        run: node scripts/package-pi.mjs release
      - name: Upload Pi testing download
        uses: actions/upload-artifact@v7
        with:
          name: pi-edition-testing
          path: |
            release/tachboard-pi-arm64.tar.gz
            release/tachboard-pi-arm64.tar.gz.sha256
          if-no-files-found: error

  docker:
    name: Publish testing image (linux amd64+arm64)
    needs: [tests]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Testing tags only
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=raw,value=testing
            type=raw,value=testing-${{ github.sha }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=tachboard-testing
          cache-to: type=gha,scope=tachboard-testing,mode=max
          build-args: |
            APP_VERSION=testing-${{ github.sha }}
            APP_REPO=${{ github.repository }}
      - name: Show published image references
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          {
            echo '## Testing image published'
            echo 'Pull and redeploy the separate TrueNAS test app to use this build.'
            echo '```text'
            printf '%s\n' "$IMAGE_TAGS"
            printf 'Digest: %s\n' "$IMAGE_DIGEST"
            echo '```'
            echo 'Use the commit-specific tag to select an older build, or pin the digest for an exact image.'
          } >> "$GITHUB_STEP_SUMMARY"